<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>终极上帝控制台</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove, query, limitToLast, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGroupId = ""; 
        let chatRef = null;
        const chatContent = document.getElementById('chatContent');

        window.onload = function() { listenAllGroups(); }

        function listenAllGroups() {
            onValue(ref(db, 'group_info'), (snapshot) => {
                const listEl = document.getElementById('groupList');
                listEl.innerHTML = '';
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let gid in data) {
                        const div = document.createElement('div');
                        div.className = 'group-item';
                        div.innerHTML = `💬 ${data[gid].name}<br><span style="font-size:10px;color:#888;">ID: ${gid} | 群主: ${data[gid].creator}</span>`;
                        div.onclick = () => spyGroup(gid);
                        listEl.appendChild(div);
                    }
                } else {
                    listEl.innerHTML = '<div style="color:#555; font-size:12px; text-align:center;">暂无群聊</div>';
                }
            });
        }

        window.spyGroup = function(gid) {
            currentGroupId = gid;
            chatContent.innerHTML = `<div style="text-align:center; color:#ff3b30; font-size:12px;">已监控群 [${gid}]</div>`;
            
            // 先解除旧监听(简单粗暴刷新界面)
            chatRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
            onChildAdded(chatRef, (snapshot) => {
                if(currentGroupId === gid) {
                    const data = snapshot.val();
                    addMsgUI(data.sender, data.text);
                }
            });
        }

        window.sendMsg = function() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text || !currentGroupId) return alert("请先在左侧选群！");
            push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统管理员", text: text, time: Date.now() });
            document.getElementById('msgInput').value = '';
        }
        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        function addMsgUI(sender, text) {
            const isMe = (sender === "📢 系统管理员");
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
            // 管理员专属操作：禁言按钮
            const muteBtn = (!isMe) ? `<span style="color:#f39c12; font-size:12px; margin-left:10px; cursor:pointer;" onclick="muteUser('${sender}')">[禁言]</span>` : '';
            div.innerHTML = `<div class="msg-name">${!isMe ? sender + muteBtn : '公告'}</div><div class="msg-text">${text}</div>`;
            chatContent.appendChild(div);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 核心功能：禁言玩家
        window.muteUser = function(name) {
            if(!currentGroupId) return;
            const time = prompt(`要禁言【${name}】多久？\n输入分钟数（例如 10 代表10分钟，输入 99999 代表永久封杀）`);
            if(!time || isNaN(time)) return;

            const muteUntil = Date.now() + (parseInt(time) * 60000);
            set(ref(db, `groups/${currentGroupId}/muted/${name}`), muteUntil).then(() => {
                alert(`已成功禁言 ${name}，时长 ${time} 分钟！`);
            });
        }

        window.clearAllGroups = function() {
            if(confirm("☢️ 确定要毁灭全网所有群吗？")) {
                remove(ref(db, 'groups')).then(()=>{ remove(ref(db, 'group_info')); alert("已清空群聊"); });
            }
        }
        window.clearAllUsers = function() {
            if(confirm("☢️ 确定要抹除所有账号吗？")) {
                remove(ref(db, 'users')).then(()=>{ alert("已抹除"); });
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #050505; height: 100vh; display: flex; color: #fff; overflow: hidden; }
        .sidebar { width: 35%; max-width: 300px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 15px; border-bottom: 1px solid #333; }
        .sidebar-header h1 { font-size: 16px; color: #ff3b30; margin-bottom: 15px; text-align: center;}
        .danger-zone { display: flex; flex-direction: column; gap: 10px;}
        .danger-btn { background: #330000; color: #ff3b30; border: 1px solid #ff3b30; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .danger-btn:hover { background: #ff3b30; color: #fff; }
        .group-list { flex: 1; overflow-y: auto; padding: 10px; }
        .group-item { background: #222; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 3px solid #007aff; font-size: 14px;}
        .group-item:hover { background: #333; }
        .main-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        .chat-header { padding: 20px; background: #111; border-bottom: 1px solid #333; }
        .chat-header h1 { font-size: 16px; }
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; display: flex; align-items: center; }
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-all;}
        .msg.mine .msg-text { background: #ff3b30; color: #fff; }
        .msg.theirs .msg-text { background: #222; color: #fff; }
        .input-area { padding: 15px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none;}
        .input-area button { background: #ff3b30; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>👑 终极上帝面板</h1>
            <div class="danger-zone">
                <button class="danger-btn" onclick="clearAllGroups()">☢️ 毁灭全网群聊</button>
                <button class="danger-btn" onclick="clearAllUsers()">☢️ 抹除所有账号</button>
            </div>
        </div>
        <div class="group-list" id="groupList"></div>
    </div>
    <div class="main-area">
        <div class="chat-header"><h1>监控台：请点击左侧群聊</h1></div>
        <div class="chat-content" id="chatContent">
            <div style="text-align:center; color:#666; margin-top:50px;">左侧雷达已开启，点击任意群可隐身偷窥...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="以管理员身份强制发公告..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发布</button>
        </div>
    </div>
</body>
</html>
