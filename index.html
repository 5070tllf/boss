<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>作者端 · 后台控制台</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, query, limitToLast,
    get, set, update, remove
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* ============ 常量 ============ */
  const AUTHOR_NAME = "作者";
  const AUTHOR_PWD_KEY = "aurora_author_ok";
  const AUTHOR_DEFAULT_PWD = "f2519484"; // 作者端密钥

  let currentGroupId = "";
  let currentView = "groups";
  let actionTargetName = "";
  let spyUnsub = null;
  let currentGroupInfo = {}; 

  /* ============ 工具 ============ */
  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/\n/g, '\\n');
  }
  function safeAtob(b64) {
    try { return b64 ? atob(b64) : '(无)'; }
    catch(e) { return '(无法解密)'; }
  }

  /* ============ 作者账号初始化 ============ */
  async function ensureAuthorUser() {
    try {
      const snap = await get(ref(db, 'users/' + AUTHOR_NAME));
      if (!snap.exists()) {
        await set(ref(db, 'users/' + AUTHOR_NAME), {
          password: btoa(AUTHOR_DEFAULT_PWD),
          deviceId: "AUTHOR-DEVICE",
          isAuthor: true
        });
      } else if (!snap.val().isAuthor) {
        await update(ref(db, 'users/' + AUTHOR_NAME), { isAuthor: true });
      }
    } catch (e) { console.warn(e); }
  }

  /* ============ 密码门禁 ============ */
  async function checkAuthorGate() {
    if (sessionStorage.getItem(AUTHOR_PWD_KEY) === "ok") {
      await ensureAuthorUser();
      initAll();
      return;
    }
    document.body.innerHTML = `
      <div style="position:fixed;inset:0;background:#0a0a0f;display:flex;justify-content:center;align-items:center;z-index:99999;">
        <div style="background:rgba(30,30,30,0.8);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);padding:40px 30px;border-radius:24px;width:85%;max-width:340px;display:flex;flex-direction:column;gap:15px;box-shadow:0 30px 60px rgba(0,0,0,0.6);">
          <h1 style="text-align:center;color:#fff;font-size:22px;font-weight:800;">作者端</h1>
          <p style="text-align:center;color:rgba(255,255,255,0.5);font-size:12px;">请输入作者密钥</p>
          <input id="authorPwd" type="password" placeholder="作者密钥"
            style="width:100%;padding:16px;border:1px solid rgba(255,255,255,0.15);border-radius:14px;background:rgba(0,0,0,0.5);color:#fff;outline:none;font-size:16px;">
          <button id="authorLoginBtn"
            style="width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7928ca);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;">
            进入
          </button>
          <p id="authorErr" style="color:#ff3b30;font-size:12px;text-align:center;min-height:16px;"></p>
        </div>
      </div>`;
    document.getElementById('authorLoginBtn').onclick = async () => {
      if (document.getElementById('authorPwd').value === AUTHOR_DEFAULT_PWD) {
        sessionStorage.setItem(AUTHOR_PWD_KEY, "ok");
        await ensureAuthorUser();
        window.location.reload();
      } else {
        document.getElementById('authorErr').innerText = "密钥错误";
      }
    };
    document.getElementById('authorPwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('authorLoginBtn').click();
    });
  }

  /* ============ 初始化 ============ */
  function initAll() {
    listenAllGroups();
    listenAllUsers();
  }

  /* ============ 群聊列表 ============ */
  function listenAllGroups() {
    onValue(ref(db, 'group_info'), (snapshot) => {
      const listEl = document.getElementById('groupList');
      if (!listEl) return;
      listEl.innerHTML = '';
      if (snapshot.exists()) {
        const data = snapshot.val();
        for (let gid in data) {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            💬 ${escapeHtml(data[gid].name || '无群名')}<br>
            <span style="font-size:10px;color:rgba(255,255,255,0.5);">
              ID: ${gid} | 群主: ${escapeHtml(data[gid].creator || '未知')}
            </span>`;
          let lastClick = 0;
          div.onclick = function () {
            const now = Date.now();
            if (now - lastClick < 350) {
              deleteGroup(gid, data[gid].name);
            } else {
              currentView = "groups";
              document.getElementById('usersView').style.display = 'none';
              document.getElementById('chatView').style.display = 'flex';
              spyGroup(gid);
            }
            lastClick = now;
          };
          listEl.appendChild(div);
        }
      } else {
        listEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无群聊</div>';
      }
    });
  }

  window.deleteGroup = function (gid, gname) {
    if (!confirm(`确定强制销毁群聊 [${gname || gid}]？`)) return;
    set(ref(db, 'group_info/' + gid), null);
    remove(ref(db, 'groups/' + gid)).then(() => alert("群聊已销毁"));
  };

  /* ============ 用户列表 ============ */
  function listenAllUsers() {
    onValue(ref(db, 'users'), (snapshot) => {
      const userListEl = document.getElementById('userList');
      if (!userListEl) return;
      userListEl.innerHTML = '';
      if (snapshot.exists()) {
        const data = snapshot.val();
        for (let uname in data) {
          const user = data[uname];
          const div = document.createElement('div');
          div.className = 'list-item user-item';
          const devShort = user.deviceId ? user.deviceId.substring(0, 8) + '...' : '未知';
          const pwdShow = safeAtob(user.password);
          div.innerHTML = `
            👤 ${escapeHtml(uname)}${user.isAuthor ? ' 👑' : ''}<br>
            <span style="font-size:10px;color:rgba(255,255,255,0.5);">
              密码: ${escapeHtml(pwdShow)} | 设备: ${devShort}
            </span>`;
          div.onclick = () => manageUser(uname, user);
          userListEl.appendChild(div);
        }
      } else {
        userListEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无用户</div>';
      }
    });
  }

  window.manageUser = function (uname, userData) {
    currentView = "users";
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('usersView').style.display = 'flex';

    const dId = userData.deviceId || "无记录";
    const plainPwd = safeAtob(userData.password);

    document.getElementById('userManageTitle').innerText = `管理: ${uname}`;
    document.getElementById('userManageContent').innerHTML = `
      <div class="user-manage-card">
        <p style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.7);">
          账号：<span style="color:#fff;font-weight:bold;">${escapeHtml(uname)}</span>
        </p>
        <p style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.7);">
          密码：<span style="color:#ff00ff;font-weight:bold;letter-spacing:1px;">${escapeHtml(plainPwd)}</span>
        </p>
        <p style="margin-bottom:12px;font-size:13px;word-break:break-all;color:rgba(255,255,255,0.7);">
          设备码：<span style="color:#00c6ff;font-weight:bold;">${escapeHtml(dId)}</span>
        </p>
        ${userData.isAuthor ? '<p style="color:#ff00ff;font-size:12px;margin-bottom:12px;">该账号是作者账号</p>' : ''}
        <button class="btn-purple" onclick="changeUserName('${escapeAttr(uname)}')">修改名字</button>
        <button class="btn-blue" onclick="changePass('${escapeAttr(uname)}')">修改密码</button>
        <button class="btn-red" onclick="deleteUser('${escapeAttr(uname)}')">强制注销</button>
        <div style="border-top:1px solid rgba(255,255,255,0.1);margin-top:15px;padding-top:15px;">
          <button class="btn-dark-red" onclick="banDevice('${escapeAttr(dId)}')">🚫 封禁该设备</button>
          <button class="btn-green" onclick="unbanDevice('${escapeAttr(dId)}')">✅ 解除封禁</button>
        </div>
      </div>`;
  };

  window.deleteUser = function (uname) {
    if (!confirm(`确认强制注销【${uname}】？`)) return;
    document.getElementById('usersView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    remove(ref(db, 'users/' + uname)).then(() => alert(`【${uname}】已注销`));
  };

  window.changeUserName = async function (oldName) {
    const newName = prompt(`将【${oldName}】的名字改为：`);
    if (!newName || newName.trim() === "" || newName === oldName) return;
    try {
      const check = await get(ref(db, 'users/' + newName));
      if (check.exists()) return alert("该名字已被占用！");
      const old = await get(ref(db, 'users/' + oldName));
      if (!old.exists()) return alert("用户不存在");
      await set(ref(db, 'users/' + newName), old.val());
      await remove(ref(db, 'users/' + oldName));

      const groupsSnap = await get(ref(db, 'group_info'));
      if (groupsSnap.exists()) {
        const groups = groupsSnap.val();
        for (let gid in groups) {
          const g = groups[gid];
          if (g.creator === oldName) {
            await update(ref(db, `group_info/${gid}`), { creator: newName });
          }
          if (g.members && g.members.includes(oldName)) {
            await update(ref(db, `group_info/${gid}`), {
              members: g.members.map(m => m === oldName ? newName : m)
            });
          }
          if (g.admins && g.admins.includes(oldName)) {
            await update(ref(db, `group_info/${gid}`), {
              admins: g.admins.map(a => a === oldName ? newName : a)
            });
          }
          const msgSnap = await get(ref(db, `groups/${gid}/messages`));
          if (msgSnap.exists()) {
            const updates = {};
            msgSnap.forEach(msg => {
              if (msg.val().sender === oldName) {
                updates[`groups/${gid}/messages/${msg.key}/sender`] = newName;
              }
            });
            if (Object.keys(updates).length) await update(ref(db), updates);
          }
        }
      }
      alert("改名成功，群聊记录已同步");
    } catch (e) {
      console.error(e);
      alert("改名失败：" + e.message);
    }
  };

  window.changePass = function (uname) {
    const newPass = prompt(`为【${uname}】设置新密码：`);
    if (!newPass) return;
    update(ref(db, 'users/' + uname), { password: btoa(newPass) }).then(() => alert("密码已修改"));
  };

  window.banDevice = function (deviceId) {
    if (deviceId === "无记录") return alert("无设备码");
    if (!confirm("确认永久封禁此设备？")) return;
    set(ref(db, 'banned_devices/' + deviceId), true).then(() => alert("已封禁"));
  };

  window.unbanDevice = function (deviceId) {
    if (deviceId === "无记录") return alert("无设备码");
    if (!confirm("确认解除此设备封禁？")) return;
    remove(ref(db, 'banned_devices/' + deviceId)).then(() => alert("已解封"));
  };

  /* ============ 作者建群 ============ */
  window.authorCreateGroup = function () {
    const gName = prompt("新群名字：");
    if (!gName || gName.trim() === "") return;
    const gid = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, 'group_info/' + gid), {
      creator: AUTHOR_NAME,
      name: gName.trim(),
      admins: [AUTHOR_NAME],
      members: [AUTHOR_NAME]
    }).then(() => alert(`建群成功\n群名：${gName}\n群号：${gid}`));
  };

  /* ============ 监控群聊 ============ */
  window.spyGroup = function (gid) {
    currentGroupId = gid;
    
    // 强制把标题和按钮渲染出来，防止被挤掉
    document.getElementById('chatTitle').innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:15px;">监控群 [${gid}]</span>
      <button class="settings-btn" style="flex-shrink:0;" onclick="openGroupSettings()">⚙️</button>`;
    
    if (spyUnsub) { spyUnsub(); spyUnsub = null; }

    const box = document.getElementById('chatContent');
    box.innerHTML = '';

    onValue(ref(db, 'group_info/' + gid), (snap) => {
      if (snap.exists()) currentGroupInfo = snap.val();
    });

    spyUnsub = onValue(query(ref(db, `groups/${gid}/messages`), limitToLast(50)), (snapshot) => {
      if (currentGroupId !== gid || currentView !== "groups") return;
      box.innerHTML = '';
      if (snapshot.exists()) {
        snapshot.forEach(child => {
          const m = child.val();
          addMsgUI(m.sender, m.text, m.isAuthorMsg);
        });
      } else {
        box.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);margin-top:50px;font-size:14px;">暂无消息</div>';
      }
    });
  };

  /* ============ 强制发言 ============ */
  window.sendMsg = function () {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return alert("内容不能为空");
    if (!currentGroupId) return alert("请先选择群聊");

    const mode = document.querySelector('input[name="sendMode"]:checked').value;
    let senderName, isAuthorMsg = false;
    if (mode === "sys") {
      senderName = "📢 系统公告";
    } else if (mode === "ghost") {
      senderName = "👑 作者(隐身)";
      isAuthorMsg = true;
    } else {
      senderName = AUTHOR_NAME;
      isAuthorMsg = true;
    }
    push(ref(db, `groups/${currentGroupId}/messages`), {
      sender: senderName,
      text,
      time: Date.now(),
      isAuthorMsg
    });
    input.value = '';
  };

  window.handleEnter = function (e) {
    if (e.key === 'Enter') sendMsg();
  };

  /* ============ 消息渲染 ============ */
  function addMsgUI(sender, text, isAuthorMsg) {
    const isSys = (sender === "📢 系统公告" || sender === "📢 系统提示");
    const isAuthor = (sender === AUTHOR_NAME || sender === "👑 作者(隐身)" || isAuthorMsg);

    const div = document.createElement('div');
    div.className = 'msg theirs';

    if (!isSys && !isAuthor) {
      div.style.cursor = 'pointer';
      div.onclick = () => showActionModal(sender);
    }

    let bubbleClass = "";
    if (sender === "📢 系统公告") bubbleClass = "bubble-sys";
    else if (isAuthor) bubbleClass = "bubble-author";

    div.innerHTML = `
      <div class="msg-name">${escapeHtml(sender)}</div>
      <div class="msg-text ${bubbleClass}">${escapeHtml(text)}</div>`;

    const box = document.getElementById('chatContent');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  /* ============ 群设置面板 ============ */
  window.openGroupSettings = function () {
    if (!currentGroupId) return alert("请先选择群聊");
    document.getElementById('settingsModal').style.display = 'flex';
    document.getElementById('displayGroupId').innerText = currentGroupId;
    loadMemberList();
  };

  window.closeSettings = function () {
    document.getElementById('settingsModal').style.display = 'none';
  };

  window.copyGroupId = function () {
    navigator.clipboard.writeText(currentGroupId).then(() => {
      alert("群号已复制！");
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = currentGroupId;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert("群号已复制！");
    });
  };

  function loadMemberList() {
    const memberListEl = document.getElementById('memberList');
    memberListEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);padding:10px;">正在扫描成员...</div>';

    const membersSet = new Set();
    if (currentGroupInfo.members) currentGroupInfo.members.forEach(m => membersSet.add(m));
    if (currentGroupInfo.creator) membersSet.add(currentGroupInfo.creator);

    memberListEl.innerHTML = '';
    membersSet.forEach(member => {
      const isMemberBoss = (member === currentGroupInfo.creator);
      const isMemberAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(member);
      let tag = isMemberBoss ? "👑 群主" : (isMemberAdmin ? "🛡️ 管理员" : "");

      const row = document.createElement('div');
      row.style = `display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;`;
      row.onclick = () => {
        closeSettings();
        showActionModal(member);
      };
      row.innerHTML = `
        <div>
          <span style="font-weight:bold;color:#fff;">${escapeHtml(member)}</span>
          <span style="font-size:12px;color:#f39c12;font-weight:bold;">${tag}</span>
        </div>
        <span style="font-size:12px;color:rgba(255,255,255,0.4);">点此操作 ›</span>`;
      memberListEl.appendChild(row);
    });
  }

  /* ============ 管理弹窗（设管/禁言/踢出） ============ */
  window.showActionModal = function (targetName) {
    actionTargetName = targetName;
    document.getElementById('modalTargetName').innerText = targetName;

    get(ref(db, `group_info/${currentGroupId}`)).then(groupSnap => {
      if (!groupSnap.exists()) return;
      const info = groupSnap.val();
      const isTargetAdmin = (info.admins && info.admins.includes(targetName));
      const isTargetOwner = info.creator === targetName;
      
      const btnSetAdmin = document.getElementById('btnSetAdmin');
      if (isTargetOwner) {
        btnSetAdmin.innerText = '该用户是群主';
        btnSetAdmin.disabled = true;
        btnSetAdmin.style.opacity = '0.5';
        btnSetAdmin.style.cursor = 'not-allowed';
      } else {
        btnSetAdmin.disabled = false;
        btnSetAdmin.style.opacity = '1';
        btnSetAdmin.style.cursor = 'pointer';
        btnSetAdmin.innerText = isTargetAdmin ? '撤销管理员' : '设为管理员';
        btnSetAdmin.onclick = isTargetAdmin ? removeAdminTarget : addAdminTarget;
      }
    });

    get(ref(db, `groups/${currentGroupId}/muted/${targetName}`)).then(muteSnap => {
      const btn = document.getElementById('btnMute');
      if (muteSnap.exists() && muteSnap.val() > Date.now()) {
        btn.innerText = '解除禁言';
        btn.style.background = 'rgba(52,199,89,0.2)';
        btn.style.color = '#30d158';
        btn.onclick = unmuteTarget;
      } else {
        btn.innerText = '禁言该用户';
        btn.style.background = 'rgba(255,149,0,0.2)';
        btn.style.color = '#ff9500';
        btn.onclick = muteTarget;
      }
    });

    document.getElementById('actionModal').style.display = 'flex';
  };

  window.closeActionModal = function () {
    document.getElementById('actionModal').style.display = 'none';
  };

  /* ============ 管理员操作逻辑 ============ */
  window.addAdminTarget = function () {
    get(ref(db, 'group_info/' + currentGroupId)).then(snap => {
      if (!snap.exists()) return;
      let admins = snap.val().admins || [];
      if (!admins.includes(actionTargetName)) {
        admins.push(actionTargetName);
        update(ref(db, 'group_info/' + currentGroupId), { admins: admins }).then(() => {
          push(ref(db, `groups/${currentGroupId}/messages`), {
            sender: "📢 系统公告",
            text: `${actionTargetName} 被作者设为管理员`,
            time: Date.now()
          });
          closeActionModal();
        });
      }
    });
  };

  window.removeAdminTarget = function () {
    get(ref(db, 'group_info/' + currentGroupId)).then(snap => {
      if (!snap.exists()) return;
      let admins = snap.val().admins || [];
      const newAdmins = admins.filter(a => a !== actionTargetName);
      update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), {
          sender: "📢 系统公告",
          text: `${actionTargetName} 被撤销管理员`,
          time: Date.now()
        });
        closeActionModal();
      });
    });
  };

  /* ============ 时间解析 & 禁言/踢人 ============ */
  window.parseTimeInput = function (input) {
    if (!input) return 0;
    input = input.trim().toLowerCase();
    if (input.includes('e+') || input.includes('e')) {
      const n = parseFloat(input.replace(/[^0-9.e+]/g, ''));
      if (isNaN(n) || n > 1e+10) return 3153600000000;
      return n * 86400000;
    }
    let n = parseFloat(input);
    if (isNaN(n)) n = 0;
    if (input.includes('m')) return n * 60000;
    if (input.includes('h')) return n * 3600000;
    if (input.includes('d')) return n * 86400000;
    return n * 60000;
  };

  window.muteTarget = function () {
    const t = prompt(`禁言【${actionTargetName}】多久？\n1m / 1h / 1d / 1e+99d（永久）`);
    if (!t) return;
    const ms = parseTimeInput(t);
    if (ms === 0) return alert("时间格式错误");
    set(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`), Date.now() + ms).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已被禁言 ${t}`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  window.unmuteTarget = function () {
    remove(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`)).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已解除禁言`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  window.kickTarget = function () {
    if (!confirm(`确认踢出【${actionTargetName}】？`)) return;
    set(ref(db, `groups/${currentGroupId}/kicked/${actionTargetName}`), true).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已被踢出`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  /* ============ 强制拉人 ============ */
  window.openPullModal = function () {
    if (!currentGroupId) return alert("请先选择群聊");
    get(ref(db, `group_info/${currentGroupId}`)).then(snap => {
      if (!snap.exists()) return alert("群不存在");
      document.getElementById('pullModal').style.display = 'flex';
      get(ref(db, 'users')).then(usersSnap => {
        const listEl = document.getElementById('pullUserList');
        listEl.innerHTML = '';
        if (usersSnap.exists()) {
          const users = usersSnap.val();
          const members = snap.val().members || [];
          for (let uname in users) {
            const inGroup = members.includes(uname);
            const row = document.createElement('div');
            row.style = "display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);";
            row.innerHTML = `
              <span style="color:#fff;font-weight:bold;">${escapeHtml(uname)}${inGroup ? ' <span style="color:#30d158;font-size:11px;">(已在群)</span>' : ''}</span>
              <input type="checkbox" class="pull-checkbox" value="${escapeAttr(uname)}" ${inGroup ? 'checked disabled' : ''}
                style="width:20px;height:20px;accent-color:#0a84ff;">`;
            listEl.appendChild(row);
          }
        }
      });
    });
  };

  window.closePullModal = function () {
    document.getElementById('pullModal').style.display = 'none';
  };

  window.confirmPull = function () {
    const boxes = document.querySelectorAll('.pull-checkbox:checked:not(:disabled)');
    if (boxes.length === 0) return alert("请勾选要拉入的用户");
    get(ref(db, `group_info/${currentGroupId}`)).then(snap => {
      if (!snap.exists()) return alert("群不存在");
      let members = snap.val().members ? [...snap.val().members] : [];
      const added = [];
      boxes.forEach(b => {
        if (!members.includes(b.value)) { members.push(b.value); added.push(b.value); }
      });
      if (added.length === 0) return alert("勾选的用户都已在群中");
      update(ref(db, `group_info/${currentGroupId}`), { members }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), {
          sender: "📢 系统提示",
          text: `作者强制邀请 ${added.join('、')} 加入了群聊`,
          time: Date.now()
        });
        alert(`已强制拉入 ${added.length} 人`);
        closePullModal();
      });
    });
  };

  /* ============ 全网操作 ============ */
  window.globalAnnouncement = function () {
    const text = prompt("全网公告内容：");
    if (!text || text.trim() === "") return;
    get(ref(db, 'group_info')).then(snap => {
      if (!snap.exists()) return alert("当前没有群聊");
      const groups = snap.val();
      let count = 0;
      for (let gid in groups) {
        push(ref(db, `groups/${gid}/messages`), {
          sender: "📢 系统公告",
          text,
          time: Date.now()
        });
        count++;
      }
      set(ref(db, 'system_broadcast'), {
        action: "global_announcement",
        text,
        time: Date.now()
      });
      alert(`已发至 ${count} 个群`);
    });
  };

  window.clearAllGroups = function () {
    if (!confirm("确定销毁全网所有群聊？不可恢复！")) return;
    set(ref(db, 'system_broadcast'), { action: "delete_all_groups", time: Date.now() });
    remove(ref(db, 'groups')).then(() => remove(ref(db, 'group_info')).then(() => {
      alert("已清空全网群聊");
      window.location.reload();
    }));
  };

  window.clearAllUsers = function () {
    if (!confirm("确定抹除所有用户？不可恢复！")) return;
    set(ref(db, 'system_broadcast'), { action: "delete_all_users", time: Date.now() });
    remove(ref(db, 'users')).then(() => {
      alert("已抹除所有用户");
      ensureAuthorUser();
    });
  };

  /* ============ 视图切换 ============ */
  window.switchLeftView = function (view, btn) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (view === 'groups') {
      document.getElementById('groupsView').style.display = 'block';
      document.getElementById('usersListView').style.display = 'none';
      document.getElementById('chatView').style.display = 'flex';
      document.getElementById('usersView').style.display = 'none';
      currentView = 'groups';
    } else {
      document.getElementById('groupsView').style.display = 'none';
      document.getElementById('usersListView').style.display = 'block';
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('usersView').style.display = 'flex';
      currentView = 'users';
      if (spyUnsub) { spyUnsub(); spyUnsub = null; }
    }
  };

  window.onload = checkAuthorGate;
</script>
<style>

  .main-area { flex:1; display:flex; flex-direction:column; background:rgba(10,10,10,0.5); backdrop-filter:blur(10px); min-width:0; }
  #chatView { display:flex; flex-direction:column; flex:1; height:100%; min-height:0; }
  
  /* 修复 iPad 上的头部布局 */
  .chat-header {
    padding:15px 20px; background:rgba(0,0,0,0.4); border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:15px; flex-shrink:0; font-weight:600; color:#fff;
    display:flex; justify-content:space-between; align-items:center; width:100%;
  }
  .settings-btn {
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);

  .chat-content {

  .btn-purple { background:rgba(155,89,182,0.2); color:#9b59b6; border:1px solid rgba(155,89,182,0.4); }
  .btn-blue { background:rgba(10,132,255,0.2); color:#0a84ff; border:1px solid rgba(10,132,255,0.4); }

  /* 弹窗 */
  #actionModal, #pullModal, #settingsModal {
    position:fixed; top:0; left:0; width:100%; height:100%;

    background:rgba(30,30,30,0.9); backdrop-filter:blur(30px);

</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>作者控制台</h1>
      <div class="view-switch">
        <button class="view-btn active" onclick="switchLeftView('groups', this)">群聊列表</button>
        <button class="view-btn" onclick="switchLeftView('users', this)">用户库</button>
      </div>
      <div class="danger-zone">
        <button class="create-btn" onclick="authorCreateGroup()">➕ 作者建群</button>
        <button class="pull-btn" onclick="openPullModal()">👥 强制拉人</button>
        <button class="global-btn" onclick="globalAnnouncement()">📢 全网公告</button>
        <button class="danger-btn" onclick="clearAllGroups()">☢️ 销毁全网群聊</button>
        <button class="danger-btn" onclick="clearAllUsers()">☢️ 抹除所有用户</button>
      </div>
    </div>
    <div class="list-container" id="groupsView"><div id="groupList"></div></div>
    <div class="list-container" id="usersListView" style="display:none;"><div id="userList"></div></div>
  </div>

  <div class="main-area">
    <div id="chatView">
      <!-- 确保在 iPad 上右上角按钮绝对不会丢失 -->
      <div class="chat-header" id="chatTitle">
        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">请点击左侧群聊</span>
        <button class="settings-btn" onclick="openGroupSettings()">⚙️</button>
      </div>
      <div class="chat-content" id="chatContent">
        <div style="text-align:center;color:rgba(255,255,255,0.4);margin-top:50px;font-size:14px;">等待接入</div>
      </div>
      <div class="input-area">
        <div class="mode-select">
          <label><input type="radio" name="sendMode" value="sys" checked> 系统公告</label>
          <label><input type="radio" name="sendMode" value="ghost"> 作者隐身</label>
          <label><input type="radio" name="sendMode" value="normal"> 作者普通</label>
        </div>
        <div class="input-row">
          <input type="text" id="msgInput" placeholder="强制发言..." onkeypress="handleEnter(event)">
          <button onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>
    <div id="usersView">
      <h1 id="userManageTitle">正在管理</h1>
      <div id="userManageContent"></div>
    </div>
  </div>

  <!-- 弹窗：管理员操作 -->
  <div id="actionModal">
    <div class="action-box">
      <h3>对 <span id="modalTargetName" style="color:#0a84ff;"></span> 操作</h3>

      <button class="btn-close" onclick="closeActionModal()">取消</button>
    </div>

      <h3>强制拉人进群</h3>

      <button class="btn-close" onclick="closePullModal()">取消</button>

    <div class="modal-box">
      <h3>群聊设置</h3>
      <div style="background:rgba(0,0,0,0.4);padding:10px;border-radius:14px;margin-bottom:15px;text-align:center;font-size:14px;border:1px solid rgba(255,255,255,0.05);">

        <button onclick="copyGroupId()" style="width:auto;padding:5px 10px;margin:5px auto 0;display:block;background:rgba(0,122,255,0.2);color:#0a84ff;font-size:12px;border-radius:6px;border:1px solid rgba(0,122,255,0.3);">一键复制</button>
      </div>
      <div class="member-list">
        <h4 style="margin-bottom:10px;color:#fff;font-size:15px;text-align:left;">群成员管理</h4>
        <div id="memberList"></div>
      </div>
      <button class="btn-close" onclick="closeSettings()" style="margin-top:20px;">关闭</button>
    </div>
  </div>
</body>
</html>
