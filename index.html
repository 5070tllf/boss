<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>作者端 · 后台控制台</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, query, limitToLast,
    get, set, update, remove
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const AUTHOR_NAME = "作者";
  const AUTHOR_PWD_KEY = "aurora_author_ok";
  const AUTHOR_DEFAULT_PWD = "f2519484"; 

  let currentGroupId = "";
  let currentView = "groups";
  let actionTargetName = "";
  let spyUnsub = null;
  let currentGroupInfo = {}; 
  
  let allUsersData = {};
  let onlineUsers = []; 
  let violationsData = {};
  let reportsData = {};
  let isPanelOpen = false;

  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/\n/g, '\\n');
  }
  function safeAtob(b64) {
    try { return b64 ? atob(b64) : '(无)'; }
    catch(e) { return '(无法解密)'; }
  }

  async function ensureAuthorUser() {
    try {
      const snap = await get(ref(db, 'users/' + AUTHOR_NAME));
      if (!snap.exists()) {
        await set(ref(db, 'users/' + AUTHOR_NAME), {
          password: btoa(AUTHOR_DEFAULT_PWD),
          deviceId: "AUTHOR-DEVICE",
          isAuthor: true
        });
      } else if (!snap.val().isAuthor) {
        await update(ref(db, 'users/' + AUTHOR_NAME), { isAuthor: true });
      }
    } catch (e) { console.warn(e); }
  }

  async function checkAuthorGate() {
    if (sessionStorage.getItem(AUTHOR_PWD_KEY) === "ok") {
      await ensureAuthorUser();
      initAll();
      return;
    }
    document.body.innerHTML = `
      <div class="aurora-bg"></div>
      <div style="position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:99999;">
        <div style="background:rgba(30,30,30,0.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);padding:40px 30px;border-radius:24px;width:85%;max-width:340px;display:flex;flex-direction:column;gap:15px;box-shadow:0 30px 60px rgba(0,0,0,0.6);">
          <h1 style="text-align:center;color:#fff;font-size:22px;font-weight:800;">作者端</h1>
          <p style="text-align:center;color:rgba(255,255,255,0.5);font-size:12px;">请输入作者密钥</p>
          <input id="authorPwd" type="password" placeholder="作者密钥"
            style="width:100%;padding:16px;border:1px solid rgba(255,255,255,0.15);border-radius:14px;background:rgba(0,0,0,0.5);color:#fff;outline:none;font-size:16px;">
          <button id="authorLoginBtn"
            style="width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7928ca);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 8px 25px rgba(255,0,128,0.4);">
            进入
          </button>
          <p id="authorErr" style="color:#ff3b30;font-size:12px;text-align:center;min-height:16px;"></p>
        </div>
      </div>`;
    document.getElementById('authorLoginBtn').onclick = async () => {
      if (document.getElementById('authorPwd').value === AUTHOR_DEFAULT_PWD) {
        sessionStorage.setItem(AUTHOR_PWD_KEY, "ok");
        await ensureAuthorUser();
        window.location.reload();
      } else {
        document.getElementById('authorErr').innerText = "密钥错误";
      }
    };
    document.getElementById('authorPwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('authorLoginBtn').click();
    });
  }

  function initAll() {
    listenAllGroups();
    listenAllUsers();
    listenOnlineStatus(); 
    listenViolations();
    listenReports();
  }

  function listenViolations() {
    onValue(ref(db, 'violations'), (snap) => {
      violationsData = snap.exists() ? snap.val() : {};
      if (currentView === 'violations') {
        document.querySelector('.view-btn:nth-child(3)').click();
      }
    });
  }

  function listenReports() {
    onValue(ref(db, 'reports'), (snap) => {
      reportsData = snap.exists() ? snap.val() : {};
      if (currentView === 'reports') {
        document.querySelector('.view-btn:nth-child(4)').click();
      }
    });
  }

  function listenOnlineStatus() {
    onValue(ref(db, 'status'), (snap) => {
      onlineUsers = [];
      if (snap.exists()) {
        const now = Date.now();
        const data = snap.val();
        for (let u in data) {
          if (data[u].online && (now - (data[u].lastActive || 0) < 15000)) {
            onlineUsers.push({ name: u, group: data[u].currentGroup || "" });
          }
        }
      }
      renderUserList();
      if (currentView === 'users' && actionTargetName) {
        if (allUsersData[actionTargetName]) {
          manageUser(actionTargetName, allUsersData[actionTargetName], true);
        }
      }
    });
  }

  function getStatusText(uname) {
    const u = onlineUsers.find(x => x.name === uname);
    if (!u) return '<span style="color:#888;">⚪ 离线</span>';
    if (u.group) return `<span style="color:#30d158;">🟢 在线 (群 ${u.group})</span>`;
    return '<span style="color:#30d158;">🟢 在线 (大厅)</span>';
  }

  function getBanStatus(deviceId) {
    if (!deviceId || deviceId === "无记录") return { banned: false, reason: "" };
    return new Promise((resolve) => {
      get(ref(db, 'banned_devices/' + deviceId)).then(snap => {
        if (snap.exists()) {
          const val = snap.val();
          resolve({ banned: true, reason: typeof val === 'object' ? (val.reason || "未填写") : "未填写" });
        } else {
          resolve({ banned: false, reason: "" });
        }
      }).catch(() => resolve({ banned: false, reason: "" }));
    });
  }

  function renderUserList() {
    const userListEl = document.getElementById('userList');
    if (!userListEl) return;
    userListEl.innerHTML = '';
    
    if (Object.keys(allUsersData).length > 0) {
      for (let uname in allUsersData) {
        const user = allUsersData[uname];
        const div = document.createElement('div');
        div.className = 'list-item user-item';
        const devShort = user.deviceId ? user.deviceId.substring(0, 8) + '...' : '未知';
        const pwdShow = safeAtob(user.password);
        const statusStr = getStatusText(uname);
        
        div.innerHTML = `
          👤 ${escapeHtml(uname)}${user.isAuthor ? ' 👑' : ''} - ${statusStr}<br>
          <span style="font-size:10px;color:rgba(255,255,255,0.5);">
            密码: ${escapeHtml(pwdShow)} | 设备: ${devShort}
          </span>`;
        div.onclick = () => manageUser(uname, user);
        userListEl.appendChild(div);
      }
    } else {
      userListEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无用户</div>';
    }
  }

  function listenAllUsers() {
    onValue(ref(db, 'users'), (snapshot) => {
      if (snapshot.exists()) {
        allUsersData = snapshot.val();
      } else {
        allUsersData = {};
      }
      renderUserList();
    });
  }

  window.manageUser = async function (uname, userData, isRefresh = false) {
    if (!isRefresh) {
      currentView = "users";
      actionTargetName = uname; 
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('usersView').style.display = 'flex';
      document.getElementById('violationsView').style.display = 'none';
      document.getElementById('reportsView').style.display = 'none';
      closeActionModal();
      closePullModal();
      closeSettings();
    }

    const dId = userData.deviceId || "无记录";
    const plainPwd = safeAtob(userData.password);
    const statusStr = getStatusText(uname);
    const banInfo = await getBanStatus(dId);

    let banHtml = "";
    if (banInfo.banned) {
      banHtml = `
        <div style="background:rgba(255,59,48,0.15); padding:12px; border-radius:12px; border:1px solid rgba(255,59,48,0.6); margin-bottom:15px; animation: pulse 2s infinite;">
          <p style="color:#ff453a; font-weight:bold; font-size:15px; margin-bottom:6px;">⚠️ 警告：设备已被封禁</p>
          <p style="color:#fff; font-size:13px;">封禁原因：${escapeHtml(banInfo.reason)}</p>
        </div>
      `;
    }

    document.getElementById('userManageTitle').innerText = `管理: ${uname}`;
    document.getElementById('userManageContent').innerHTML = `
      <div class="user-manage-card">
        ${banHtml}
        <p style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.7);">
          账号：<span style="color:#fff;font-weight:bold;">${escapeHtml(uname)}</span>
        </p>
        <p style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.7);">
          状态：<span style="font-weight:bold;">${statusStr}</span>
        </p>
        <p style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.7);">
          密码：<span style="color:#ffd700;font-weight:bold;letter-spacing:1px;">${escapeHtml(plainPwd)}</span>
        </p>
        <p style="margin-bottom:12px;font-size:13px;word-break:break-all;color:rgba(255,255,255,0.7);">
          设备码：<span style="color:#00c6ff;font-weight:bold;">${escapeHtml(dId)}</span>
        </p>
        ${userData.isAuthor ? '<p style="color:#ffd700;font-size:12px;margin-bottom:12px;">该账号是作者账号</p>' : ''}
        <button class="btn-purple" onclick="changeUserName('${escapeAttr(uname)}')">修改名字</button>
        <button class="btn-blue" onclick="changePass('${escapeAttr(uname)}')">修改密码</button>
        <button class="btn-red" onclick="deleteUser('${escapeAttr(uname)}')">强制注销</button>
        <div style="border-top:1px solid rgba(255,255,255,0.1);margin-top:15px;padding-top:15px;">
          <button class="btn-dark-red" onclick="banDevice('${escapeAttr(dId)}')">🚫 封禁该设备</button>
          <button class="btn-green" onclick="unbanDevice('${escapeAttr(dId)}')">✅ 解除封禁</button>
        </div>
      </div>`;
  };

  window.renderViolations = function() {
    const el = document.getElementById('violationsList');
    el.innerHTML = '';
    const sorted = Object.keys(violationsData).map(name => {
      return { name, ...violationsData[name] };
    }).sort((a, b) => b.count - a.count);

    if (sorted.length === 0) {
      el.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无违规记录</div>';
      return;
    }

    sorted.forEach(v => {
      const div = document.createElement('div');
      div.className = 'list-item user-item';
      div.style.borderLeftColor = '#ff3b30';
      div.style.cursor = 'pointer';
      
      div.innerHTML = `
        <span style="color:#ff3b30;font-weight:bold;">⚠️ ${escapeHtml(v.name)}</span> (违规 ${v.count} 次)<br>
        <span style="font-size:10px;color:rgba(255,255,255,0.5);">
          最后违规内容: "${escapeHtml(v.lastWord)}"
        </span>`;

      div.onclick = () => { 
        const reason = prompt(`【${v.name}】违规 ${v.count} 次。\n请输入要在客户端屏幕上警告他的话：`, "你已多次使用违规词汇，请文明发言！");
        if (reason) {
          set(ref(db, 'warnings/' + v.name), { active: true, reason: reason, time: Date.now() }).then(() => {
            alert(`已向【${v.name}】发送客户端强制警告！`);
          });
        }
      };

      div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (confirm(`确定要删除【${v.name}】的违规记录吗？`)) {
          remove(ref(db, 'violations/' + v.name)).then(() => alert("记录已删除"));
        }
      });

      let touchTimer;
      let isMoved = false;
      div.addEventListener('touchstart', (e) => {
        isMoved = false;
        touchTimer = setTimeout(() => {
          if (!isMoved) {
            if (confirm(`确定要删除【${v.name}】的违规记录吗？`)) {
              remove(ref(db, 'violations/' + v.name)).then(() => alert("记录已删除"));
            }
          }
        }, 800);
      }, { passive: true });

      div.addEventListener('touchmove', () => {
        isMoved = true;
        if (touchTimer) clearTimeout(touchTimer);
      }, { passive: true });

      div.addEventListener('touchend', () => {
        if (touchTimer) clearTimeout(touchTimer);
      });

      el.appendChild(div);
    });
  };

  window.renderReports = function() {
    const el = document.getElementById('reportsList');
    el.innerHTML = '';
    const sorted = Object.keys(reportsData).map(key => {
      return { key, ...reportsData[key] };
    }).sort((a, b) => b.time - a.time);

    if (sorted.length === 0) {
      el.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无玩家举报</div>';
      return;
    }

    sorted.forEach(r => {
      const div = document.createElement('div');
      div.className = 'list-item user-item';
      div.style.borderLeftColor = '#ff9500';
      div.style.cursor = 'pointer';
      
      div.innerHTML = `
        <span style="color:#ff9500;font-weight:bold;">🚨 被举报人: ${escapeHtml(r.target)}</span><br>
        <span style="font-size:12px;color:rgba(255,255,255,0.8);">
          原因: ${escapeHtml(r.reason)}
        </span><br>
        <span style="font-size:10px;color:rgba(255,255,255,0.5);">
          举报人: ${escapeHtml(r.reporter)} | ${new Date(r.time).toLocaleString()}
        </span>`;

      div.onclick = () => { 
        const reason = prompt(`对被举报人【${r.target}】发送警告：`, `你被举报存在违规行为（${r.reason}），请规范发言！`);
        if (reason) {
          set(ref(db, 'warnings/' + r.target), { active: true, reason: reason, time: Date.now() }).then(() => {
            alert(`已向【${r.target}】发送客户端强制警告！`);
            if(confirm("是否同时删除这条举报记录？")) {
              remove(ref(db, 'reports/' + r.key));
            }
          });
        }
      };

      div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (confirm(`确定要删除这条举报记录吗？`)) {
          remove(ref(db, 'reports/' + r.key)).then(() => alert("记录已删除"));
        }
      });

      let touchTimer;
      let isMoved = false;
      div.addEventListener('touchstart', (e) => {
        isMoved = false;
        touchTimer = setTimeout(() => {
          if (!isMoved) {
            if (confirm(`确定要删除这条举报记录吗？`)) {
              remove(ref(db, 'reports/' + r.key)).then(() => alert("记录已删除"));
            }
          }
        }, 800);
      }, { passive: true });

      div.addEventListener('touchmove', () => {
        isMoved = true;
        if (touchTimer) clearTimeout(touchTimer);
      }, { passive: true });

      div.addEventListener('touchend', () => {
        if (touchTimer) clearTimeout(touchTimer);
      });

      el.appendChild(div);
    });
  };

  function listenAllGroups() {
    onValue(ref(db, 'group_info'), (snapshot) => {
      const listEl = document.getElementById('groupList');
      if (!listEl) return;
      listEl.innerHTML = '';
      if (snapshot.exists()) {
        const data = snapshot.val();
        for (let gid in data) {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            💬 ${escapeHtml(data[gid].name || '无群名')}<br>
            <span style="font-size:10px;color:rgba(255,255,255,0.5);">
              ID: ${gid} | 群主: ${escapeHtml(data[gid].creator || '未知')}
            </span>`;
          let lastClick = 0;
          div.onclick = function () {
            const now = Date.now();
            if (now - lastClick < 350) {
              deleteGroup(gid, data[gid].name);
            } else {
              currentView = "groups";
              document.getElementById('usersView').style.display = 'none';
              document.getElementById('violationsView').style.display = 'none';
              document.getElementById('reportsView').style.display = 'none';
              document.getElementById('chatView').style.display = 'flex';
              spyGroup(gid);
              closeActionModal();
              closePullModal();
              closeSettings();
            }
            lastClick = now;
          };
          listEl.appendChild(div);
        }
      } else {
        listEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:12px;">暂无群聊</div>';
      }
    });
  }

  window.deleteGroup = function (gid, gname) {
    if (!confirm(`确定强制销毁群聊 [${gname || gid}]？`)) return;
    set(ref(db, 'group_info/' + gid), null);
    remove(ref(db, 'groups/' + gid)).then(() => alert("群聊已销毁"));
  };

  window.deleteUser = function (uname) {
    if (!confirm(`确认强制注销【${uname}】？`)) return;
    document.getElementById('usersView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    remove(ref(db, 'users/' + uname)).then(() => alert(`【${uname}】已注销`));
  };

  window.changeUserName = async function (oldName) {
    const newName = prompt(`将【${oldName}】的名字改为：`);
    if (!newName || newName.trim() === "" || newName === oldName) return;
    try {
      const check = await get(ref(db, 'users/' + newName));
      if (check.exists()) return alert("该名字已被占用！");
      const old = await get(ref(db, 'users/' + oldName));
      if (!old.exists()) return alert("用户不存在");
      await set(ref(db, 'users/' + newName), old.val());
      await remove(ref(db, 'users/' + oldName));

      const groupsSnap = await get(ref(db, 'group_info'));
      if (groupsSnap.exists()) {
        const groups = groupsSnap.val();
        for (let gid in groups) {
          const g = groups[gid];
          if (g.creator === oldName) await update(ref(db, `group_info/${gid}`), { creator: newName });
          if (g.members && g.members.includes(oldName)) {
            await update(ref(db, `group_info/${gid}`), { members: g.members.map(m => m === oldName ? newName : m) });
          }
          if (g.admins && g.admins.includes(oldName)) {
            await update(ref(db, `group_info/${gid}`), { admins: g.admins.map(a => a === oldName ? newName : a) });
          }
          const msgSnap = await get(ref(db, `groups/${gid}/messages`));
          if (msgSnap.exists()) {
            const updates = {};
            msgSnap.forEach(msg => {
              if (msg.val().sender === oldName) updates[`groups/${gid}/messages/${msg.key}/sender`] = newName;
            });
            if (Object.keys(updates).length) await update(ref(db), updates);
          }
        }
      }
      alert("改名成功，群聊记录已同步");
    } catch (e) { alert("改名失败：" + e.message); }
  };

  window.changePass = function (uname) {
    const newPass = prompt(`为【${uname}】设置新密码：`);
    if (!newPass) return;
    update(ref(db, 'users/' + uname), { password: btoa(newPass) }).then(() => alert("密码已修改"));
  };

  window.banDevice = function (deviceId) {
    if (deviceId === "无记录") return alert("无设备码");
    const reason = prompt("请输入封禁原因（如：辱骂群友、发色情广告等）：");
    if (reason === null) return;
    if (!confirm(`确认永久封禁此设备？\n原因：${reason}`)) return;
    set(ref(db, 'banned_devices/' + deviceId), { banned: true, reason: reason }).then(() => {
      alert("已封禁");
      if (currentView === 'users' && actionTargetName) {
        manageUser(actionTargetName, allUsersData[actionTargetName], true);
      }
    });
  };

  window.unbanDevice = function (deviceId) {
    if (deviceId === "无记录") return alert("无设备码");
    if (!confirm("确认解除此设备封禁？")) return;
    remove(ref(db, 'banned_devices/' + deviceId)).then(() => {
      alert("已解封");
      if (currentView === 'users' && actionTargetName) {
        manageUser(actionTargetName, allUsersData[actionTargetName], true);
      }
    });
  };

  window.togglePanel = function() {
    isPanelOpen = !isPanelOpen;
    document.getElementById('advancedPanel').style.display = isPanelOpen ? 'flex' : 'none';
    document.getElementById('toggleBtn').innerText = isPanelOpen ? '🔼 收起高级面板' : '⚙️ 展开高级面板';
  };

  window.publishUpdate = function () {
    const text = prompt("请输入本次系统更新公告（用户仅会看到一次，点击确定后不再弹出）：");
    if (!text || text.trim() === "") return;
    set(ref(db, 'system_broadcast'), {
      action: "global_announcement",
      text,
      time: Date.now()
    }).then(() => alert("更新公告已全网推送！"));
  };

  window.cancelUpdate = function () {
    if (!confirm("⚠️ 警告：确定要撤销当前的更新公告吗？\n撤销后，你将可以发布新的公告。")) return;
    remove(ref(db, 'system_broadcast')).then(() => {
      alert("✅ 当前公告已撤销，你可以发布新的更新公告了！");
    });
  };

  window.authorCreateGroup = function () {
    const gName = prompt("新群名字：");
    if (!gName || gName.trim() === "") return;
    const gid = Math.floor(1000 + Math.random() * 9000).toString();
    set(ref(db, 'group_info/' + gid), {
      creator: AUTHOR_NAME,
      name: gName.trim(),
      admins: [AUTHOR_NAME],
      members: [AUTHOR_NAME]
    }).then(() => alert(`建群成功\n群名：${gName}\n群号：${gid}`));
  };

  window.batchBroadcast = function() {
    const text = prompt("⚡ 输入要发送给【全网所有群】的聊天消息：");
    if (!text || text.trim() === "") return;
    get(ref(db, 'group_info')).then(snap => {
      if (!snap.exists()) return alert("当前没有群聊");
      const groups = snap.val();
      let count = 0;
      for (let gid in groups) {
        push(ref(db, `groups/${gid}/messages`), {
          sender: AUTHOR_NAME,
          text: text,
          time: Date.now(),
          isAuthorMsg: true
        });
        count++;
      }
      alert(`已批量穿透发送至 ${count} 个群！`);
    });
  };

  window.fakeBroadcast = function() {
    const targetName = prompt("🎭 要伪装成谁的名字？(直接输入群里的成员名)");
    if (!targetName || targetName.trim() === "") return;
    const text = prompt(`请输入【${targetName}】要发送的内容：`);
    if (!text || text.trim() === "") return;
    
    get(ref(db, 'group_info')).then(snap => {
      if (!snap.exists()) return alert("当前没有群聊");
      const groups = snap.val();
      let count = 0;
      for (let gid in groups) {
        push(ref(db, `groups/${gid}/messages`), {
          sender: targetName,
          text: text,
          time: Date.now()
        });
        count++;
      }
      alert(`已伪装成【${targetName}】发至全网 ${count} 个群！`);
    });
  };

  window.globalAnnouncement = function () {
    const text = prompt("全网公告内容：");
    if (!text || text.trim() === "") return;
    get(ref(db, 'group_info')).then(snap => {
      if (!snap.exists()) return alert("当前没有群聊");
      const groups = snap.val();
      let count = 0;
      for (let gid in groups) {
        push(ref(db, `groups/${gid}/messages`), {
          sender: "📢 系统公告",
          text,
          time: Date.now()
        });
        count++;
      }
      alert(`已发至 ${count} 个群`);
    });
  };

  window.clearAllGroups = function () {
    if (!confirm("确定销毁全网所有群聊？不可恢复！")) return;
    set(ref(db, 'system_broadcast'), { action: "delete_all_groups", time: Date.now() });
    remove(ref(db, 'groups')).then(() => remove(ref(db, 'group_info')).then(() => {
      alert("已清空全网群聊");
      window.location.reload();
    }));
  };

  window.clearAllUsers = function () {
    if (!confirm("确定抹除所有用户？不可恢复！")) return;
    set(ref(db, 'system_broadcast'), { action: "delete_all_users", time: Date.now() });
    remove(ref(db, 'users')).then(() => {
      alert("已抹除所有用户");
      ensureAuthorUser();
    });
  };

  window.spyGroup = function (gid) {
    currentGroupId = gid;
    
    document.getElementById('chatTitle').innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:15px;">监控群 [${gid}]</span>
      <button class="settings-btn" style="flex-shrink:0;" onclick="openGroupSettings()">⚙️</button>`;
    
    if (spyUnsub) { spyUnsub(); spyUnsub = null; }

    const box = document.getElementById('chatContent');
    box.innerHTML = '';

    onValue(ref(db, 'group_info/' + gid), (snap) => {
      if (snap.exists()) {
        currentGroupInfo = snap.val();
        const banner = document.getElementById('muteAllBanner');
        if (currentGroupInfo.muteAll) {
          banner.style.display = 'block';
        } else {
          banner.style.display = 'none';
        }
        if (document.getElementById('settingsModal').style.display === 'flex') {
          document.getElementById('muteAllToggle').checked = !!currentGroupInfo.muteAll;
        }
      }
    });

    spyUnsub = onValue(query(ref(db, `groups/${gid}/messages`), limitToLast(50)), (snapshot) => {
      if (currentGroupId !== gid || currentView !== "groups") return;
      box.innerHTML = '';
      if (snapshot.exists()) {
        snapshot.forEach(child => {
          const m = child.val();
          addMsgUI(child.key, m.sender, m.text, m.isAuthorMsg);
        });
      } else {
        box.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);margin-top:50px;font-size:14px;">暂无消息</div>';
      }
    });
  };

  window.sendMsg = function () {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return alert("内容不能为空");
    if (!currentGroupId) return alert("请先选择群聊");

    const mode = document.querySelector('input[name="sendMode"]:checked').value;
    let senderName, isAuthorMsg = false;
    if (mode === "sys") {
      senderName = "📢 系统公告";
    } else if (mode === "ghost") {
      senderName = "👑 作者(隐身)";
      isAuthorMsg = true;
    } else {
      senderName = AUTHOR_NAME;
      isAuthorMsg = true;
    }
    push(ref(db, `groups/${currentGroupId}/messages`), {
      sender: senderName,
      text,
      time: Date.now(),
      isAuthorMsg
    });
    input.value = '';
  };

  window.handleEnter = function (e) {
    if (e.key === 'Enter') sendMsg();
  };

  function addMsgUI(msgId, sender, text, isAuthorMsg) {
    const isSys = (sender === "📢 系统公告" || sender === "📢 系统提示");
    const isAuthor = (sender === AUTHOR_NAME || sender === "👑 作者(隐身)" || isAuthorMsg);

    const div = document.createElement('div');
    div.className = 'msg theirs';
    
    if (!isSys && !isAuthor) {
      div.style.cursor = 'pointer';
      div.onclick = () => showActionModal(sender);
    }

    let bubbleClass = "";
    if (isAuthor) bubbleClass = "bubble-gold";

    div.innerHTML = `
      <div class="msg-name">${escapeHtml(sender)}</div>
      <div class="msg-text ${bubbleClass}">${escapeHtml(text)}</div>`;
      
    div.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (confirm(`撤回该消息？`)) {
        remove(ref(db, `groups/${currentGroupId}/messages/${msgId}`));
      }
    });

    const box = document.getElementById('chatContent');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  window.openGroupSettings = function () {
    if (!currentGroupId) return alert("请先选择群聊");
    document.getElementById('settingsModal').style.display = 'flex';
    document.getElementById('displayGroupId').innerText = currentGroupId;
    loadMemberList();
    document.getElementById('muteAllToggle').checked = !!currentGroupInfo.muteAll;
  };

  window.closeSettings = function () {
    document.getElementById('settingsModal').style.display = 'none';
  };

  window.copyGroupId = function () {
    navigator.clipboard.writeText(currentGroupId).then(() => alert("群号已复制！"));
  };

  window.toggleMuteAll = function(e) {
    const isChecked = e.target.checked;
    update(ref(db, 'group_info/' + currentGroupId), { muteAll: isChecked }).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: isChecked ? `作者开启了全员禁言` : `作者解除了全员禁言`,
        time: Date.now()
      });
    });
  };

  window.clearGroupChat = function () {
    if (!confirm("⚠️ 警告：确定要清空该群的全部聊天记录吗？\n（包括系统公告，此操作会同步到所有玩家）")) return;
    remove(ref(db, `groups/${currentGroupId}/messages`)).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `作者已清空本群的聊天记录`,
        time: Date.now()
      });
      alert("聊天记录已彻底清空！");
      closeSettings();
    }).catch(err => {
      alert("清空失败：" + err.message);
    });
  };

  function loadMemberList() {
    const memberListEl = document.getElementById('memberList');
    memberListEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);padding:10px;">正在扫描成员...</div>';

    const membersSet = new Set();
    if (currentGroupInfo.members) currentGroupInfo.members.forEach(m => membersSet.add(m));
    if (currentGroupInfo.creator) membersSet.add(currentGroupInfo.creator);

    memberListEl.innerHTML = '';
    membersSet.forEach(member => {
      const isMemberBoss = (member === currentGroupInfo.creator);
      const isMemberAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(member);
      let tag = isMemberBoss ? "👑 群主" : (isMemberAdmin ? "🛡️ 管理员" : "");

      const row = document.createElement('div');
      row.style = `display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;`;
      row.onclick = () => {
        closeSettings();
        showActionModal(member);
      };
      row.innerHTML = `
        <div>
          <span style="font-weight:bold;color:#fff;">${escapeHtml(member)}</span>
          <span style="font-size:12px;color:#f39c12;font-weight:bold;">${tag}</span>
        </div>
        <span style="font-size:12px;color:rgba(255,255,255,0.4);">点此操作 ›</span>`;
      memberListEl.appendChild(row);
    });
  }

  window.showActionModal = function (targetName) {
    actionTargetName = targetName;
    document.getElementById('modalTargetName').innerText = targetName;

    get(ref(db, `group_info/${currentGroupId}`)).then(groupSnap => {
      if (!groupSnap.exists()) return;
      const info = groupSnap.val();
      const isTargetAdmin = (info.admins && info.admins.includes(targetName));
      const isTargetOwner = info.creator === targetName;
      
      const btnSetAdmin = document.getElementById('btnSetAdmin');
      if (isTargetOwner) {
        btnSetAdmin.innerText = '该用户是群主';
        btnSetAdmin.disabled = true;
        btnSetAdmin.style.opacity = '0.5';
        btnSetAdmin.style.cursor = 'not-allowed';
      } else {
        btnSetAdmin.disabled = false;
        btnSetAdmin.style.opacity = '1';
        btnSetAdmin.style.cursor = 'pointer';
        btnSetAdmin.innerText = isTargetAdmin ? '撤销管理员' : '设为管理员';
        btnSetAdmin.onclick = isTargetAdmin ? removeAdminTarget : addAdminTarget;
      }
    });

    get(ref(db, `groups/${currentGroupId}/muted/${targetName}`)).then(muteSnap => {
      const btn = document.getElementById('btnMute');
      if (muteSnap.exists() && muteSnap.val() > Date.now()) {
        btn.innerText = '解除禁言';
        btn.style.background = 'rgba(52,199,89,0.2)';
        btn.style.color = '#30d158';
        btn.onclick = unmuteTarget;
      } else {
        btn.innerText = '禁言该用户';
        btn.style.background = 'rgba(255,149,0,0.2)';
        btn.style.color = '#ff9500';
        btn.onclick = muteTarget;
      }
    });

    document.getElementById('actionModal').style.display = 'flex';
  };

  window.closeActionModal = function () {
    document.getElementById('actionModal').style.display = 'none';
  };

  window.manualViolation = function () {
    if (!actionTargetName) return;
    const reason = prompt(`请输入【${actionTargetName}】的违规原因或内容：`);
    if (reason === null) return;
    
    get(ref(db, 'violations/' + actionTargetName)).then(snap => {
      const currentCount = snap.exists() ? snap.val().count : 0;
      set(ref(db, 'violations/' + actionTargetName), {
        count: currentCount + 1,
        lastTime: Date.now(),
        lastWord: reason || "（作者手动标记）"
      }).then(() => {
        alert(`已成功将【${actionTargetName}】标记为违规。`);
        closeActionModal();
      });
    });
  };

  window.addAdminTarget = function () {
    get(ref(db, 'group_info/' + currentGroupId)).then(snap => {
      if (!snap.exists()) return;
      let admins = snap.val().admins || [];
      if (!admins.includes(actionTargetName)) {
        admins.push(actionTargetName);
        update(ref(db, 'group_info/' + currentGroupId), { admins: admins }).then(() => {
          push(ref(db, `groups/${currentGroupId}/messages`), {
            sender: "📢 系统公告",
            text: `${actionTargetName} 被作者设为管理员`,
            time: Date.now()
          });
          closeActionModal();
        });
      }
    });
  };

  window.removeAdminTarget = function () {
    get(ref(db, 'group_info/' + currentGroupId)).then(snap => {
      if (!snap.exists()) return;
      let admins = snap.val().admins || [];
      const newAdmins = admins.filter(a => a !== actionTargetName);
      update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), {
          sender: "📢 系统公告",
          text: `${actionTargetName} 被撤销管理员`,
          time: Date.now()
        });
        closeActionModal();
      });
    });
  };

  window.parseTimeInput = function (input) {
    if (!input) return 0;
    input = input.trim().toLowerCase();
    if (input.includes('e+') || input.includes('e')) {
      const n = parseFloat(input.replace(/[^0-9.e+]/g, ''));
      if (isNaN(n) || n > 1e+10) return 3153600000000;
      return n * 86400000;
    }
    let n = parseFloat(input);
    if (isNaN(n)) n = 0;
    if (input.includes('m')) return n * 60000;
    if (input.includes('h')) return n * 3600000;
    if (input.includes('d')) return n * 86400000;
    return n * 60000;
  };

  window.muteTarget = function () {
    const t = prompt(`禁言【${actionTargetName}】多久？\n1m / 1h / 1d / 1e+99d（永久）`);
    if (!t) return;
    const ms = parseTimeInput(t);
    if (ms === 0) return alert("时间格式错误");
    set(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`), Date.now() + ms).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已被禁言 ${t}`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  window.unmuteTarget = function () {
    remove(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`)).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已解除禁言`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  window.kickTarget = function () {
    if (!confirm(`确认踢出【${actionTargetName}】？`)) return;
    set(ref(db, `groups/${currentGroupId}/kicked/${actionTargetName}`), true).then(() => {
      push(ref(db, `groups/${currentGroupId}/messages`), {
        sender: "📢 系统公告",
        text: `${actionTargetName} 已被踢出`,
        time: Date.now()
      });
      closeActionModal();
    });
  };

  window.openPullModal = function () {
    if (!currentGroupId) return alert("请先选择群聊");
    get(ref(db, `group_info/${currentGroupId}`)).then(snap => {
      if (!snap.exists()) return alert("群不存在");
      document.getElementById('pullModal').style.display = 'flex';
      get(ref(db, 'users')).then(usersSnap => {
        const listEl = document.getElementById('pullUserList');
        listEl.innerHTML = '';
        if (usersSnap.exists()) {
          const users = usersSnap.val();
          const members = snap.val().members || [];
          for (let uname in users) {
            const inGroup = members.includes(uname);
            const row = document.createElement('div');
            row.style = "display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid rgba(255,255,255,0.1);";
            row.innerHTML = `
              <span style="color:#fff;font-weight:bold;">${escapeHtml(uname)}${inGroup ? ' <span style="color:#30d158;font-size:11px;">(已在群)</span>' : ''}</span>
              <input type="checkbox" class="pull-checkbox" value="${escapeAttr(uname)}" ${inGroup ? 'checked disabled' : ''}
                style="width:20px;height:20px;accent-color:#0a84ff;">`;
            listEl.appendChild(row);
          }
        }
      });
    });
  };

  window.closePullModal = function () {
    document.getElementById('pullModal').style.display = 'none';
  };

  window.confirmPull = function () {
    const boxes = document.querySelectorAll('.pull-checkbox:checked:not(:disabled)');
    if (boxes.length === 0) return alert("请勾选要拉入的用户");
    get(ref(db, `group_info/${currentGroupId}`)).then(snap => {
      if (!snap.exists()) return alert("群不存在");
      let members = snap.val().members ? [...snap.val().members] : [];
      const added = [];
      boxes.forEach(b => {
        if (!members.includes(b.value)) { members.push(b.value); added.push(b.value); }
      });
      if (added.length === 0) return alert("勾选的用户都已在群中");
      update(ref(db, `group_info/${currentGroupId}`), { members }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), {
          sender: "📢 系统提示",
          text: `作者强制邀请 ${added.join('、')} 加入了群聊`,
          time: Date.now()
        });
        alert(`已强制拉入 ${added.length} 人`);
        closePullModal();
      });
    });
  };

  window.switchLeftView = function (view, btn) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (view === 'groups') {
      document.getElementById('groupsView').style.display = 'block';
      document.getElementById('usersListView').style.display = 'none';
      document.getElementById('violationsView').style.display = 'none';
      document.getElementById('reportsView').style.display = 'none';
      document.getElementById('chatView').style.display = 'flex';
      document.getElementById('usersView').style.display = 'none';
      currentView = 'groups';
    } else if (view === 'users') {
      document.getElementById('groupsView').style.display = 'none';
      document.getElementById('usersListView').style.display = 'block';
      document.getElementById('violationsView').style.display = 'none';
      document.getElementById('reportsView').style.display = 'none';
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('usersView').style.display = 'flex';
      currentView = 'users';
      if (spyUnsub) { spyUnsub(); spyUnsub = null; }
    } else if (view === 'violations') {
      document.getElementById('groupsView').style.display = 'none';
      document.getElementById('usersListView').style.display = 'none';
      document.getElementById('violationsView').style.display = 'block';
      document.getElementById('reportsView').style.display = 'none';
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('usersView').style.display = 'flex';
      currentView = 'violations';
      renderViolations();
      if (spyUnsub) { spyUnsub(); spyUnsub = null; }
    } else if (view === 'reports') {
      document.getElementById('groupsView').style.display = 'none';
      document.getElementById('usersListView').style.display = 'none';
      document.getElementById('violationsView').style.display = 'none';
      document.getElementById('reportsView').style.display = 'block';
      document.getElementById('chatView').style.display = 'none';
      document.getElementById('usersView').style.display = 'flex';
      currentView = 'reports';
      renderReports();
      if (spyUnsub) { spyUnsub(); spyUnsub = null; }
    }
  };

  window.onload = checkAuthorGate;
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-tap-highlight-color:transparent; }

  #toggleBtn {
    width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #00c6ff; font-weight: bold; font-size: 13px; border-radius: 10px; cursor: pointer; transition: 0.2s;
  }
  #toggleBtn:active { background: rgba(255,255,255,0.1); }

  .danger-zone { display:none; flex-direction:column; gap:8px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 10px; }
  
  .btn-batch { background:rgba(0,198,255,0.15); color:#00c6ff; border:1px solid rgba(0,198,255,0.4); padding:10px 4px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px; }
  .btn-fake { background:rgba(255,0,128,0.15); color:#ff0080; border:1px solid rgba(255,0,128,0.4); padding:10px 4px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px; }
  .danger-btn { background:rgba(255,59,48,0.1); color:#ff453a; border:1px solid rgba(255,59,48,0.3); padding:10px 4px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px; }
  .global-btn { background:rgba(255,0,255,0.1); color:#ff00ff; border:1px solid rgba(255,0,255,0.3); padding:10px 4px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px; }

  .create-btn { background:rgba(52,199,89,0.15); color:#30d158; border:1px solid rgba(52,199,89,0.4); padding:10px 4px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px; }

  .list-container { flex:1; overflow-y:auto; padding:10px; -webkit-overflow-scrolling:touch; }
  .list-item {
    padding:14px; border-radius:12px; cursor:pointer; font-size:13px; line-height:1.5;
    background:rgba(255,255,255,0.05); margin-bottom:10px;
    border:1px solid rgba(255,255,255,0.08); border-left:3px solid #0a84ff; transition:0.2s;
  }
  .list-item:hover { background:rgba(255,255,255,0.1); }
  .user-item { border-left-color:#f1c40f; }

  .main-area { flex:1; display:flex; flex-direction:column; background:rgba(10,10,10,0.5); backdrop-filter:blur(10px); min-width:0; z-index: 5; }
  #chatView { display:flex; flex-direction:column; flex:1; height:100%; min-height:0; }
  
  .chat-header {
    padding:15px 20px; background:rgba(0,0,0,0.4); border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:15px; flex-shrink:0; font-weight:600; color:#fff;
    display:flex; justify-content:space-between; align-items:center; width:100%;
  }
  .settings-btn {
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    font-size:18px; cursor:pointer; color:#fff; border-radius:10px; 
    padding:6px 12px; transition:0.2s; flex-shrink:0;
    display: flex; align-items: center; justify-content: center;
  }
  .settings-btn:active { background:rgba(255,255,255,0.2); transform:scale(0.95); }
  
  .chat-content {
    flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column;
    gap:15px; -webkit-overflow-scrolling:touch;
  }
  .msg { display:flex; flex-direction:column; max-width:80%; align-self:flex-start; }
  .msg-name { font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:6px; }
  .msg-text {
    padding:12px 16px; border-radius:16px; font-size:15px; line-height:1.4;
    word-break:break-all; background:rgba(255,255,255,0.1); color:#fff;
    border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px);
  }
  
  .bubble-gold {
    background:linear-gradient(135deg,#ffd700,#ff8c00) !important;
    color:#000 !important; font-weight:900; border:1px solid #ffeb3b !important;
    box-shadow:0 0 25px rgba(255,215,0,0.8) !important;
    animation:goldPulse 1.8s infinite;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }
  @keyframes goldPulse {
    0% { box-shadow:0 0 12px rgba(255,215,0,0.4); }
    50% { box-shadow:0 0 28px rgba(255,215,0,1); }
    100% { box-shadow:0 0 12px rgba(255,215,0,0.4); }
  }

  .input-area {
    padding:15px; background:rgba(0,0,0,0.5); border-top:1px solid rgba(255,255,255,0.1);
    display:flex; flex-direction:column; gap:10px;
    padding-bottom:calc(15px + env(safe-area-inset-bottom)); flex-shrink:0;
  }
  .mode-select { display:flex; gap:15px; font-size:12px; color:rgba(255,255,255,0.7); overflow-x:auto; white-space:nowrap; }
  .mode-select label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .input-row { display:flex; gap:10px; }
  .input-row input {
    flex:1; padding:14px; border-radius:14px; border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05); color:#fff; outline:none; font-size:15px; min-width:0;
  }
  .input-row button {
    background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000; border:none;
    padding:0 20px; border-radius:14px; font-weight:bold; cursor:pointer; flex-shrink:0;
  }

  #usersView { display:none; flex-direction:column; padding:20px; flex:1; overflow-y:auto; }
  #userManageTitle { font-size:20px; color:#f1c40f; margin-bottom:20px; font-weight:800; }
  .user-manage-card {
    background:rgba(30,30,30,0.8); padding:20px; border-radius:20px;
    border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(20px);
  }
  .user-manage-card button {
    width:100%; padding:14px; border-radius:12px; border:none;
    font-weight:bold; font-size:15px; cursor:pointer; margin-bottom:12px;
  }
  .btn-purple { background:rgba(155,89,182,0.2); color:#9b59b6; border:1px solid rgba(155,89,182,0.4); }
  .btn-blue { background:rgba(10,132,255,0.2); color:#0a84ff; border:1px solid rgba(10,132,255,0.4); }
  .btn-red { background:rgba(255,59,48,0.2); color:#ff453a; border:1px solid rgba(255,59,48,0.4); }
  .btn-dark-red { background:rgba(142,68,173,0.2); color:#8e44ad; border:1px solid rgba(142,68,173,0.4); }
  .btn-green { background:rgba(52,199,89,0.2); color:#30d158; border:1px solid rgba(52,199,89,0.4); }

  /* 弹窗 */
  #actionModal, #pullModal, #settingsModal {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(10px);
    display:none; justify-content:center; align-items:center; z-index:9999;
  }
  .action-box, .pull-box, .modal-box {
    background:rgba(30,30,30,0.95); backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.15); width:85%; max-width:320px;
    padding:24px; border-radius:24px; display:flex; flex-direction:column;
    gap:12px; box-shadow:0 20px 50px rgba(0,0,0,0.6); max-height:80vh;
    overflow-y: auto;
  }
  .action-box h3, .pull-box h3, .modal-box h3 { text-align:center; margin-bottom:10px; color:#fff; font-size:18px; font-weight:800; }
  .action-box button, .pull-box button, .modal-box button {
    padding:14px; border-radius:12px; font-weight:600; font-size:16px; cursor:pointer; border:none;
  }
  .btn-close { background:rgba(255,255,255,0.1); color:#fff; margin-top:5px; }
  .pull-list {
    flex:1; overflow-y:auto; max-height:40vh;
    background:rgba(0,0,0,0.2); border-radius:12px; padding:5px; margin-bottom:10px;
  }
  .member-list {
    margin-top:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;
  }
</style>
</head>
<body>
  <div class="aurora-bg"></div>

  <div class="sidebar">
    <div class="sidebar-header">
      <h1>作者控制台</h1>
      <div class="view-switch">
        <button class="view-btn active" onclick="switchLeftView('groups', this)">群聊</button>
        <button class="view-btn" onclick="switchLeftView('users', this)">用户</button>
        <button class="view-btn" onclick="switchLeftView('violations', this)">违规</button>
        <button class="view-btn" onclick="switchLeftView('reports', this)">举报</button>
      </div>
      
      <button id="toggleBtn" onclick="togglePanel()">⚙️ 展开高级面板</button>
      <div id="advancedPanel" class="danger-zone">
        <button class="create-btn" onclick="publishUpdate()" style="background:rgba(255,215,0,0.15);color:#ffd700;border-color:rgba(255,215,0,0.4);">📢 发布版本更新</button>
        <button class="danger-btn" onclick="cancelUpdate()" style="background:rgba(255,59,48,0.15);color:#ff453a;border-color:rgba(255,59,48,0.4);">🗑️ 撤销当前更新公告</button>
        <button class="btn-batch" onclick="batchBroadcast()">⚡ 批量穿透发言</button>
        <button class="btn-fake" onclick="fakeBroadcast()">🎭 伪装全网发言</button>
        <button class="create-btn" onclick="authorCreateGroup()">➕ 作者建群</button>
        <button class="pull-btn" onclick="openPullModal()">👥 强制拉人</button>
        <button class="global-btn" onclick="globalAnnouncement()">📢 全网聊天公告</button>
        <button class="danger-btn" onclick="clearAllGroups()">☢️ 销毁全网群聊</button>
        <button class="danger-btn" onclick="clearAllUsers()">☢️ 抹除所有用户</button>
      </div>

    </div>
    <div class="list-container" id="groupsView"><div id="groupList"></div></div>
    <div class="list-container" id="usersListView" style="display:none;"><div id="userList"></div></div>
    <div class="list-container" id="violationsView" style="display:none;"><div id="violationsList"></div></div>
    <div class="list-container" id="reportsView" style="display:none;"><div id="reportsList"></div></div>
  </div>

  <div class="main-area">
    <div id="chatView">
      <div class="chat-header" id="chatTitle">
        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">请点击左侧群聊</span>
        <button class="settings-btn" onclick="openGroupSettings()">⚙️</button>
      </div>

      <div id="muteAllBanner" style="display:none; background:linear-gradient(90deg, rgba(255,59,48,0.8), rgba(255,0,127,0.8)); color:#fff; text-align:center; padding:8px; font-size:13px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,0.5); flex-shrink:0;">
        ⚠️ 群主开启了全员禁言
      </div>

      <div class="chat-content" id="chatContent">
        <div style="text-align:center;color:rgba(255,255,255,0.4);margin-top:50px;font-size:14px;">等待接入</div>
      </div>
      <div class="input-area">
        <div class="mode-select">
          <label><input type="radio" name="sendMode" value="sys" checked> 系统公告</label>
          <label><input type="radio" name="sendMode" value="ghost"> 作者隐身</label>
          <label><input type="radio" name="sendMode" value="normal"> 作者普通</label>
        </div>
        <div class="input-row">
          <input type="text" id="msgInput" placeholder="强制发言..." onkeypress="handleEnter(event)">
          <button onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>
    <div id="usersView">
      <h1 id="userManageTitle">正在管理</h1>
      <div id="userManageContent"></div>
    </div>
  </div>

  <div id="actionModal">
    <div class="action-box">
      <h3>对 <span id="modalTargetName" style="color:#0a84ff;"></span> 操作</h3>
      <button id="btnSetAdmin" style="background:rgba(0,122,255,0.2);color:#0a84ff;border:1px solid rgba(0,122,255,0.4);">设为管理员</button>
      <button id="btnMute" style="background:rgba(255,149,0,0.2);color:#ff9500;border:1px solid rgba(255,149,0,0.4);">禁言该用户</button>
      
      <!-- 手动标记违规 -->
      <button onclick="manualViolation()" style="background:rgba(255,59,48,0.2);color:#ff453a;border:1px solid rgba(255,59,48,0.4);font-weight:bold;">⚠️ 手动标记违规</button>
      
      <button onclick="kickTarget()" style="background:rgba(255,59,48,0.2);color:#ff453a;border:1px solid rgba(255,59,48,0.4);">踢出群聊</button>
      <button class="btn-close" onclick="closeActionModal()">取消</button>
    </div>
  </div>

  <div id="pullModal">
    <div class="pull-box">
      <h3>强制拉人进群</h3>
      <p style="font-size:12px;color:#aaa;text-align:center;margin-bottom:10px;">勾选后点确认，用户刷新网页即可在群列表看到</p>
      <div class="pull-list" id="pullUserList"></div>
      <button onclick="confirmPull()" style="background:rgba(10,132,255,0.2);color:#0a84ff;border:1px solid rgba(10,132,255,0.4);font-weight:bold;">确认拉入</button>
      <button class="btn-close" onclick="closePullModal()">取消</button>
    </div>
  </div>

  <div id="settingsModal">
    <div class="modal-box">
      <h3>群聊设置</h3>
      
      <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,59,48,0.1); padding:12px; border-radius:14px; border:1px solid rgba(255,59,48,0.3); margin-bottom:15px;">
        <div style="font-size:14px; font-weight:bold; color:#ff453a;">🚫 全员禁言</div>
        <input type="checkbox" id="muteAllToggle" onchange="toggleMuteAll(event)" style="width:20px; height:20px; accent-color:#ff3b30; cursor:pointer;">
      </div>

      <div style="background:rgba(0,0,0,0.4);padding:10px;border-radius:14px;margin-bottom:15px;text-align:center;font-size:14px;border:1px solid rgba(255,255,255,0.05);">
        群号：<strong id="displayGroupId" style="color:#00c6ff;font-size:18px;text-shadow:0 0 10px rgba(0,198,255,0.5);"></strong>
        <button onclick="copyGroupId()" style="width:auto;padding:5px 10px;margin:5px auto 0;display:block;background:rgba(0,122,255,0.2);color:#0a84ff;font-size:12px;border-radius:6px;border:1px solid rgba(0,122,255,0.3);">一键复制</button>
      </div>
      <div class="member-list">
        <h4 style="margin-bottom:10px;color:#fff;font-size:15px;text-align:left;">群成员管理</h4>
        <div id="memberList"></div>
      </div>
      
      <button onclick="clearGroupChat()" style="background:rgba(255,149,0,0.2);color:#ff9500;border:1px solid rgba(255,149,0,0.4);margin-top:20px;">🧹 清空本群聊天记录</button>
      <button class="btn-close" onclick="closeSettings()" style="margin-top:10px;">关闭</button>
    </div>
  </div>
</body>
</html>
