<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>终极上帝控制台</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove, query, limitToLast, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentGroupId = ""; 
        let chatRef = null;
        const chatContent = document.getElementById('chatContent');

        window.onload = function() { listenAllGroups(); }

        // 实时监控群列表
        function listenAllGroups() {
            onValue(ref(db, 'group_info'), (snapshot) => {
                const listEl = document.getElementById('groupList');
                listEl.innerHTML = '';
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let gid in data) {
                        const div = document.createElement('div');
                        div.className = 'group-item';
                        // 显示群名和群主
                        div.innerHTML = `💬 ${data[gid].name || '无群名'}<br><span style="font-size:10px;color:#888;">ID: ${gid} | 群主: ${data[gid].creator}</span>`;
                        div.onclick = () => spyGroup(gid);
                        listEl.appendChild(div);
                    }
                } else {
                    listEl.innerHTML = '<div style="color:#555; font-size:12px; text-align:center;">全网暂无群聊</div>';
                }
            });
        }

        // 隐身进入群聊
        window.spyGroup = function(gid) {
            currentGroupId = gid;
            chatContent.innerHTML = `<div style="text-align:center; color:#ff3b30; font-size:12px; margin-bottom:15px;">已隐身监控群 [${gid}]，对方毫无察觉...</div>`;
            
            chatRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
            onChildAdded(chatRef, (snapshot) => {
                if(currentGroupId === gid) {
                    const data = snapshot.val();
                    addMsgUI(data.sender, data.text);
                }
            });
        }

        // 强制发公告
        window.sendMsg = function() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text || !currentGroupId) return alert("请先在左侧选一个群！");
            
            // 以系统管理员身份发送
            push(ref(db, `groups/${currentGroupId}/messages`), { 
                sender: "📢 系统管理员", 
                text: text, 
                time: Date.now() 
            });
            document.getElementById('msgInput').value = '';
        }
        
        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        // 渲染消息（带上作者专属特效）
        function addMsgUI(sender, text) {
            const isMe = (sender === "📢 系统管理员");
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
            
            // 禁言按钮
            const muteBtn = (!isMe) ? `<span style="color:#f39c12; font-size:12px; margin-left:10px; cursor:pointer;" onclick="muteUser('${sender}')">[禁言]</span>` : '';
            
            div.innerHTML = `
                <div class="msg-name">${!isMe ? sender + muteBtn : '系统广播'}</div>
                <div class="msg-text ${isMe ? 'admin-glow' : ''}">${text}</div>
            `;
            chatContent.appendChild(div);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 禁言玩家
        window.muteUser = function(name) {
            if(!currentGroupId) return;
            const time = prompt(`要禁言【${name}】多久？\n输入分钟数（例如 10 代表10分钟，输入 99999 代表永久禁言）`);
            if(!time || isNaN(time)) return;

            const muteUntil = Date.now() + (parseInt(time) * 60000);
            set(ref(db, `groups/${currentGroupId}/muted/${name}`), muteUntil).then(() => {
                alert(`已成功禁言 ${name} ${time} 分钟！`);
            });
        }

        // 核武器：清空所有群
        window.clearAllGroups = function() {
            if(confirm("☢️ 确定要毁灭全网所有群聊吗？所有聊天记录将灰飞烟灭！")) {
                remove(ref(db, 'groups')).then(()=>{ 
                    remove(ref(db, 'group_info')).then(() => {
                        alert("所有群聊已清空！"); 
                        window.location.reload();
                    });
                });
            }
        }

        // 核武器：清空所有账号
        window.clearAllUsers = function() {
            if(confirm("☢️ 确定要抹除所有账号密码吗？同学将无法登录！")) {
                remove(ref(db, 'users')).then(()=>{ alert("所有账号已抹除！"); });
            }
        }
    </script>
    <style>
        /* ================= 完美设备适配 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        /* 使用 dvh 适配所有设备的真实可见高度 */
        body { background: #050505; height: 100vh; height: 100dvh; display: flex; color: #fff; overflow: hidden; }

        /* ================= 左侧雷达 ================= */
        .sidebar { width: 35%; max-width: 320px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 15px; border-bottom: 1px solid #333; }
        .sidebar-header h1 { font-size: 16px; color: #ff3b30; margin-bottom: 15px; text-align: center;}
        
        .danger-zone { display: flex; flex-direction: column; gap: 8px;}
        .danger-btn { background: #330000; color: #ff3b30; border: 1px solid #ff3b30; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px;}
        .danger-btn:hover { background: #ff3b30; color: #fff; }
        
        .group-list { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch;}
        .group-item { background: #222; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 3px solid #007aff; font-size: 14px; line-height: 1.4;}
        .group-item:hover { background: #333; transform: translateX(3px); }

        /* ================= 右侧聊天区 ================= */
        .main-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        .chat-header { padding: 20px; background: #111; border-bottom: 1px solid #333; }
        .chat-header h1 { font-size: 16px; color: #fff; }
        
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; -webkit-overflow-scrolling: touch;}
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; display: flex; align-items: center; }
        
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-all; }
        .msg.mine .msg-text { background: #ff3b30; color: #fff; }
        .msg.theirs .msg-text { background: #222; color: #fff; }

        /* 🌟 作者专属降维打击发光特效 🌟 */
        .admin-glow {
            background: linear-gradient(135deg, #ff3b30, #ff007f) !important;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.8), 0 0 30px rgba(255, 0, 127, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(255, 59, 48, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 59, 48, 1), 0 0 40px rgba(255, 0, 127, 0.8); }
            100% { box-shadow: 0 0 15px rgba(255, 59, 48, 0.6); }
        }

        /* ================= 底部输入框适配 ================= */
        .input-area { 
            padding: 15px; background: #111; border-top: 1px solid #333; 
            display: flex; gap: 10px; 
            /* 适配苹果手机底部小黑条 */
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
        }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none; font-size: 15px;}
        .input-area button { background: #ff3b30; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex-shrink: 0;}
        
        /* 针对极窄屏幕的优化 */
        @media (max-width: 400px) {
            .sidebar { width: 40%; }
            .danger-btn { font-size: 12px; padding: 8px; }
            .msg-text { font-size: 14px; padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <!-- 左侧：全网雷达 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>👑 上帝面板</h1>
            <div class="danger-zone">
                <button class="danger-btn" onclick="clearAllGroups()">☢️ 毁灭所有群</button>
                <button class="danger-btn" onclick="clearAllUsers()">☢️ 抹除所有号</button>
            </div>
        </div>
        <div class="group-list" id="groupList">
            <!-- 群列表自动生成 -->
        </div>
    </div>

    <!-- 右侧：监控聊天区 -->
    <div class="main-area">
        <div class="chat-header">
            <h1>监控台：请点击左侧群聊</h1>
        </div>
        <div class="chat-content" id="chatContent">
            <div style="text-align:center; color:#666; margin-top:50px;">左侧雷达已开启，点击任意群可隐身偷窥...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="发系统公告 (带全屏特效)..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发布</button>
        </div>
    </div>
</body>
</html>
