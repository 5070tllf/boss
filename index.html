<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>游戏作者端 · 上帝控制台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:#000; color:#fff; height:100vh; height:100dvh; display:flex; overflow:hidden; }
#gateScreen { position:fixed; inset:0; background:#0a0a0f; display:flex; justify-content:center; align-items:center; padding:20px; z-index:99999; overflow-y:auto; }
#gateScreen .box { background:rgba(30,30,30,0.8); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.15); padding:36px 28px; border-radius:24px; width:85%; max-width:340px; }
#gateScreen h1 { color:#ffd700; text-align:center; margin-bottom:20px; font-size:22px; }
#gateScreen input { width:100%; padding:14px; border:1px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(0,0,0,0.5); color:#fff; outline:none; font-size:16px; margin-bottom:12px; }
#gateScreen button { width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000; font-weight:800; font-size:16px; cursor:pointer; }
#gateScreen .err { color:#ff3b30; text-align:center; font-size:13px; margin-top:10px; min-height:20px; white-space:pre-wrap; }

#app { display:none; flex:1; }
.sidebar { width:34%; max-width:340px; min-width:110px; background:rgba(20,20,20,0.7); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; }
.sidebar-header { padding:14px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:14px; font-weight:800; color:#ffd700; text-align:center; }
#playerList { flex:1; overflow-y:auto; padding:8px; -webkit-overflow-scrolling:touch; }
.player-item { padding:10px; margin-bottom:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; cursor:pointer; user-select: none; }
.player-item:active { background:rgba(255,255,255,0.12); }
.main-area { flex:1; overflow-y:auto; padding:14px; background:rgba(10,10,10,0.6); -webkit-overflow-scrolling:touch; }
.card { background:rgba(30,30,30,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; margin-bottom:12px; }
.card-title { font-size:14px; font-weight:800; color:#00c6ff; margin-bottom:10px; }
.btn { width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; background:rgba(0,198,255,0.15); color:#00c6ff; border:1px solid rgba(0,198,255,0.3); margin-bottom:8px; }
.btn-red { background:rgba(255,59,48,0.15); color:#ff453a; border-color:rgba(255,59,48,0.3); }
.btn-green { background:rgba(52,199,89,0.15); color:#30d158; border-color:rgba(52,199,89,0.3); }
.btn-gold { background:rgba(255,215,0,0.15); color:#ffd700; border-color:rgba(255,215,0,0.3); }
.btn-purple { background:rgba(156,39,176,0.15); color:#ce93d8; border-color:rgba(156,39,176,0.3); }
.btn-jade { background:rgba(0,229,255,0.15); color:#00e5ff; border-color:rgba(0,229,255,0.3); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:999999; display:none; justify-content:center; align-items:center; padding:20px; }
.modal-box { background:rgba(30,30,30,0.95); border:1px solid rgba(255,255,255,0.15); border-radius:24px; width:90%; max-width:400px; max-height:80vh; display:flex; flex-direction:column; padding:20px; }
.modal-title { font-size:18px; font-weight:900; color:#ffd700; text-align:center; margin-bottom:15px; }
.modal-content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:8px;}
.modal-close { margin-top:15px; padding:12px; border-radius:12px; background:rgba(255,255,255,0.1); color:#fff; border:none; font-weight:bold; cursor:pointer; }
.list-item { padding:10px 12px; background:rgba(255,255,255,0.05); border-radius:8px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.list-item:active { background:rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div id="gateScreen">
  <div class="box">
    <h1>🎮 作者上帝端</h1>
    <input id="pwdInput" type="password" placeholder="作者密钥" autocomplete="off">
    <button id="gateBtn" type="button">进入</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">🎮 玩家列表 (长按可删)</div>
    <div id="playerList"><div style="color:#666;text-align:center;padding:20px;font-size:12px;">加载中...</div></div>
  </div>
  <div class="main-area" id="playerDetail">
    <div style="text-align:center;color:#666;padding:50px;font-size:14px;">点击左侧玩家查看详情</div>
  </div>
</div>

<div class="modal-overlay" id="selectModal">
  <div class="modal-box">
    <div class="modal-title" id="selectModalTitle">请选择</div>
    <div class="modal-content" id="selectModalContent"></div>
    <button class="modal-close" onclick="document.getElementById('selectModal').style.display='none'">取消</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
const AUTHOR_PWD = "f2519484";
const AUTH_KEY = "game_admin_auth_v2";

const QUALITY_NAMES = ['凡品','下品','中品','上品','极品','仙品','神品','至宝','灵宝','玄宝','天宝','圣宝','道宝','尊宝','王宝','皇宝','帝宝','君宝','仙宝','神宝','圣尊宝','道尊宝','天主宝','圣天主宝','道天主宝','混沌至宝','鸿蒙至宝','星辰神石','紫微神石','太初神石','混元道果','天道道果','大道道果','鸿蒙道果','无极道果','太上道果','造化玉碟','混沌珠','盘古斧','东皇钟','太极图','诛仙剑','山河社稷图','炼妖壶','昊天塔','伏羲琴','神农鼎','昆仑镜','崆峒印','凤凰琴','九霄环佩','天问神剑','太虚神甲','大罗天衣','无极仙袍','造化仙袍','鸿蒙仙袍','圣道仙袍','天道仙袍','大道仙袍','混沌至宝','鸿蒙本源','宇宙本源','万物母气','天地玄黄','鸿蒙紫气','大道法则','混沌法则','终极本源','起源之石','维度结晶','时空沙漏','因果之丝','命运纺锤','虚无之源','创世神剑','灭世黑莲','不朽神座','永恒天舟','星空古路','神话之翼','纪元之书','真理之眼','无尽深渊','璀璨星海','神魔之血','仙帝传承','天道载体','大道仙宫','混元道胎','无极神图','鸿蒙紫府','造化玉盘','太上道剑','混沌神鼎','鸿蒙圣衣','本源神格','宇宙之心','万物母胎','鸿蒙青莲','创世青莲','灭世黑莲','造化青莲','混沌青莲','大道青莲','天道青莲','鸿蒙青莲','虚无青莲','终焉青莲'];
const PART_NAMES = { weapon:'武器', helmet:'头盔', armor:'护甲', boots:'靴子', ring:'戒指', necklace:'项链', belt:'腰带', artifact:'法宝' };
const PART_KEYS = ['weapon','helmet','armor','boots','ring','necklace','belt','artifact'];
const REALM_NAMES = ['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫','真仙','玄仙','地仙','天仙','金仙','大罗金仙','混元大罗金仙','准圣','圣人','天道圣人','大道圣人','鸿蒙圣人','造化圣人','混元圣人','无极圣人','太上圣人','混沌圣人','鸿蒙主宰','大道主宰','无极大道','太初大道','太易大道','太始大道','太素大道','太极大道','混元无极大罗金仙','混元太上无极金仙','混元太初无上金仙','混元太易无上金仙','混元太始无上金仙','混元太素无上金仙','混元太极无上金仙','混元太极大罗金仙','混元无极太上金仙','混元无上太初金仙','混元无上太易金仙','混元无上太始金仙','混元无上太素金仙','混元无上太极金仙','混元无极天道圣人','混元无上大道圣人','混元无极鸿蒙圣人','混元无上造化圣人','混元无极混元圣人','混元无上无极圣人','混元无极太上圣人','混元无上混沌圣人','混元无极鸿蒙主宰','混元无上大道主宰','混元无极无极大道','太上无极混元无上大道','太上无极混元无上天道','太上无极混元无上鸿蒙','太上无极混元无上造化','太上无极混元无上混沌','太上无极混元无上本源','太上无极混元无上终极','大道本源无上主宰','鸿蒙本源无上主宰','混沌本源无上主宰','宇宙本源无上主宰','万物本源无上主宰','终极本源无上主宰'];
const PET_NAMES = ['灵狐','火麒麟','九尾狐','白虎','朱雀','玄武','青龙','穷奇','饕餮','混沌','梼杌','金乌','鲲鹏','凤凰','麒麟','狻猊','睚眦','囚牛','蒲牢','霸下'];
const SPIRIT_NAMES = ['树精','石灵','剑灵','火灵','水灵','风灵','雷灵','光灵','暗灵','花精','药灵','器灵','符灵','阵灵','傀灵','妖灵','魔灵','仙灵','神灵','圣灵'];
const PET_ATK = [5,15,40,100,250,500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000,2000000,5000000,10000000,50000000];
const SPIRIT_HP = [30,100,300,800,2000,5000,10000,20000,50000,100000,200000,500000,1000000,2000000,5000000,10000000,20000000,50000000,100000000,500000000];
const SPELL_DEFS = [{ id:'sword', name:'御剑术' }, { id:'flame', name:'烈焰诀' }, { id:'ice', name:'寒冰咒' }, { id:'shield', name:'金刚罩' }, { id:'wind', name:'疾风步' }, { id:'heal', name:'回春术' }];

let db = null;
let allPlayers = {};
let selectedPlayer = null;

function parseBigNum(str, fallback) {
  if (str === null || str === undefined || str === '') return fallback;
  str = String(str).trim().toLowerCase();
  let num = Number(str);
  if (!isNaN(num)) return num;
  return 1.7e308;
}

function safeNum(v, fallback) { return (typeof v !== 'number' || !isFinite(v) || isNaN(v)) ? (fallback || 0) : v; }
function fmt(v) { v = safeNum(v, 0); const abs = Math.abs(v); if (abs < 10000) return Math.floor(v).toString(); if (abs < 1e8) return (v/1e4).toFixed(2) + '万'; if (abs < 1e12) return (v/1e8).toFixed(2) + '亿'; if (abs < 1e16) return (v/1e12).toFixed(2) + '万亿'; return v.toExponential(2); }
function escapeHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function errShow(msg) { document.getElementById('gateErr').innerText = msg; }

function boot() {
  const btn = document.getElementById('gateBtn'); const input = document.getElementById('pwdInput');
  if (!btn || !input) return;
  btn.onclick = () => { if (input.value === AUTHOR_PWD) { localStorage.setItem(AUTH_KEY, 'ok'); enterAdmin(); } else errShow('密钥错误'); };
  if (localStorage.getItem(AUTH_KEY) === 'ok') enterAdmin();
}

function enterAdmin() {
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (!db) { const app2 = initializeApp(firebaseConfig); db = getDatabase(app2); }
  
  onValue(ref(db, 'game_players'), (snap) => {
    allPlayers = snap.exists() ? snap.val() : {};
    renderPlayerList();
    if (selectedPlayer && allPlayers[selectedPlayer]) renderPlayerDetail(selectedPlayer, allPlayers[selectedPlayer]);
  });
}

let pressTimer = null;
function renderPlayerList() {
  const el = document.getElementById('playerList'); el.innerHTML = '';
  const ids = Object.keys(allPlayers);
  if (ids.length === 0) { el.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:12px;">暂无玩家</div>'; return; }
  ids.sort((a,b) => safeNum(allPlayers[b].lastActive,0) - safeNum(allPlayers[a].lastActive,0));
  
  ids.forEach(id => {
    const p = allPlayers[id]; const div = document.createElement('div'); div.className = 'player-item';
    if (id === selectedPlayer) div.style.background = 'rgba(255,215,0,0.15)';
    div.innerHTML = `<div style="font-weight:bold;color:#fff;font-size:13px;">${escapeHtml(p.name||'无名')}</div><div style="font-size:11px;color:#888;margin-top:3px;">${REALM_NAMES[safeNum(p.realm,0)]||'炼气'} ${safeNum(p.realmLevel,1)}层 · Lv.${fmt(p.charLevel)}</div>`;
    
    div.onclick = () => { selectedPlayer = id; renderPlayerList(); renderPlayerDetail(id, p); };
    
    div.oncontextmenu = (e) => { e.preventDefault(); return false; };
    div.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => {
        if(confirm(`☢️ 警告！长按触发销毁。确定要彻底抹除玩家【${p.name}】的全部数据吗？此操作不可逆！`)) {
            destroyPlayerAccount(id, p.name);
        }
      }, 800);
    });
    div.addEventListener('touchend', () => clearTimeout(pressTimer));
    div.addEventListener('touchmove', () => clearTimeout(pressTimer));
    
    el.appendChild(div);
  });
}

window.destroyPlayerAccount = function(id, name) {
  remove(ref(db, 'game_players/' + id)).then(() => {
    get(ref(db, 'game_accounts')).then(snap => {
      if(snap.exists()){
        const accs = snap.val();
        for(let key in accs){
          if(accs[key].playerId === id || key === name){
            remove(ref(db, 'game_accounts/' + key));
          }
        }
      }
    });
    remove(ref(db, 'game_config/banned_players/' + id));
    
    if(selectedPlayer === id) { selectedPlayer = null; document.getElementById('playerDetail').innerHTML = ''; }
    alert(`✅ 玩家【${name}】的所有数据已从服务器物理销毁。`);
  });
}

function renderPlayerDetail(id, p) {
  const el = document.getElementById('playerDetail');
  
  const spellsHtml = SPELL_DEFS.map(sp => {
    const d = (p.spells && p.spells[sp.id]) || { level: 1, upgradeEnd: 0 };
    const isUp = d.upgradeEnd > Date.now();
    return `<div style="padding:8px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:6px;font-size:12px;">
      <div><b style="color:#ffd700;">${sp.name}</b> Lv.${fmt(d.level)} ${isUp?`<span style="color:#00c6ff;">(升级中)</span>`:''}</div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn" style="margin:0;padding:6px;font-size:11px;" onclick="setSpellLevel('${id}','${sp.id}')">设等级</button>
        ${isUp ? `<button class="btn btn-gold" style="margin:0;padding:6px;font-size:11px;" onclick="speedupSpell('${id}','${sp.id}')">加速</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const eqHtml = PART_KEYS.map(part => {
    const eq = p.equipment && p.equipment[part];
    if (!eq) return `<div style="padding:6px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;color:#666;">${PART_NAMES[part]}: 空</div>`;
    return `<div style="padding:6px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;">
      <div><b style="color:#ffd700;">${PART_NAMES[part]}</b> ${QUALITY_NAMES[eq.quality]||'未知'} ${eq.enhance?'+'+fmt(eq.enhance):''}</div>
      <div style="color:#aaa;">攻${fmt(eq.atk)} 血${fmt(eq.hp)}</div>
      <div style="display:flex;gap:4px;margin-top:4px;">
        <button class="btn btn-gold" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setEquipEnhance('${id}','${part}')">改强化</button>
        <button class="btn btn-purple" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setEquipStats('${id}','${part}')">改属性</button>
      </div>
    </div>`;
  }).join('');

  let invHtml = '';
  if (p.inventory && p.inventory.length > 0) {
    invHtml = p.inventory.slice(0, 20).map((eq, idx) => {
      return `<div style="padding:6px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;margin-bottom:4px;">
        <div style="color:#888;">[背包] ${PART_NAMES[eq.part]||'未知'} - ${QUALITY_NAMES[eq.quality]||'未知'}</div>
        <div style="color:#aaa;">攻${fmt(eq.atk)} 血${fmt(eq.hp)}</div>
        <div style="display:flex;gap:4px;margin-top:4px;">
          <button class="btn btn-gold" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setInvEquipEnhance('${id}', ${idx})">改强化</button>
          <button class="btn btn-purple" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setInvEquipStats('${id}', ${idx})">改属性</button>
          <button class="btn btn-red" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="deleteInvEquip('${id}', ${idx})">删除</button>
        </div>
      </div>`;
    }).join('');
    if (p.inventory.length > 20) invHtml += `<div style="text-align:center;font-size:10px;color:#666;">...还有 ${p.inventory.length - 20} 件装备未展示</div>`;
  } else {
    invHtml = '<div style="color:#666;font-size:11px;">背包为空</div>';
  }

  el.innerHTML = `
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#ffd700;margin-bottom:8px;">${escapeHtml(p.name||'无名')}</div>
      <div style="font-size:12px;color:#aaa;line-height:1.8;">
        ID：${id}<br>Lv.${fmt(p.charLevel)} · 经验 ${fmt(p.exp)}<br>
        境界 ${REALM_NAMES[safeNum(p.realm,0)]||'炼气'} ${safeNum(p.realmLevel,1)}层<br>
        仙树 Lv.${fmt(p.treeLevel)} ${(p.treeUpgradeEnd>Date.now())?`(培育中)`:''}<br>
        轮回 ${safeNum(p.reincarnateCount,0)} 次 | 天赋点 ${safeNum(p.talentPoints,0)}<br>
        宗门 ${p.sect?p.sect.name:'无'} | 贡献 ${safeNum(p.sectPoints,0)}<br>
        💎 仙玉 ${fmt(p.jade)} · 🍑 仙桃 ${fmt(p.peaches)}<br>
        攻${fmt(p.atk)} 血${fmt(p.hp)}
      </div>
      ${(p.treeUpgradeEnd > Date.now()) ? `<button class="btn btn-gold" style="margin-top:8px;" onclick="speedupTree('${id}')">⚡ 加速仙树</button>` : ''}
    </div>
    
    <div class="card">
      <div class="card-title">✉️ 邮件系统 (可发所有物品)</div>
      <button class="btn btn-blue" onclick="sendMail('${id}')">发送邮件给此玩家</button>
      <button class="btn btn-gold" onclick="sendMail('all')">群发邮件给全服玩家</button>
    </div>

    <div class="card">
      <div class="card-title">🎁 发布特惠礼包</div>
      <button class="btn btn-gold" onclick="createGiftPack()">发布新礼包</button>
      <button class="btn btn-red" onclick="clearAllGifts()">🗑️ 清空所有礼包</button>
    </div>

    <div class="card">
      <div class="card-title">📦 发放物品</div>
      <button class="btn btn-jade" onclick="sendJade('${id}')">💎 发放仙玉</button>
      <button class="btn" onclick="sendPeaches('${id}')">🍑 发放仙桃</button>
      <button class="btn" onclick="sendExp('${id}')">⭐ 发放经验</button>
      <button class="btn btn-purple" onclick="sendTalent('${id}')">✨ 发放天赋点</button>
      <button class="btn btn-green" onclick="sendSect('${id}')">🏯 发放宗门贡献</button>
      <button class="btn" onclick="sendEquipment('${id}')">⚔️ 发放装备（选品质）</button>
      <button class="btn btn-gold" onclick="sendPet('${id}')">🐾 发放灵兽</button>
      <button class="btn btn-purple" onclick="sendSpirit('${id}')">👻 发放精怪</button>
    </div>

    <div class="card">
      <div class="card-title">🔧 修改核心数值</div>
      <div class="grid2">

window.confirmSendMail = async function(targetId) {
  const title = document.getElementById('mail_title').value || '系统邮件';
  const content = document.getElementById('mail_content').value || '请查收附件奖励。';
  let attachments = {};
  
  const jade = parseBigNum(document.getElementById('mail_jade').value, 0); if (jade > 0) attachments.jade = jade;
  const peaches = parseBigNum(document.getElementById('mail_peaches').value, 0); if (peaches > 0) attachments.peaches = peaches;
  const exp = parseBigNum(document.getElementById('mail_exp').value, 0); if (exp > 0) attachments.exp = exp;
  const talent = parseBigNum(document.getElementById('mail_talentPoints').value, 0); if (talent > 0) attachments.talentPoints = talent;
  const sectPoints = parseBigNum(document.getElementById('mail_sectPoints').value, 0); if (sectPoints > 0) attachments.sectPoints = sectPoints;
  
  const pet = parseBigNum(document.getElementById('mail_pet').value, 0); if (pet > 0) attachments.pet = pet;
  const spirit = parseBigNum(document.getElementById('mail_spirit').value, 0); if (spirit > 0) attachments.spirit = spirit;
  
  const equipQuality = parseInt(document.getElementById('mail_equip_quality').value);
  if (equipQuality >= 0) attachments.equipment = { quality: equipQuality };

  if (Object.keys(attachments).length === 0) return alert("请至少填写一种附件！");

  const mailData = { title, content, attachments, time: Date.now(), claimed: false };

  if (targetId === 'all') {
    if(!confirm("⚠️ 确定要全服群发此邮件吗？")) return;
    get(ref(db, 'game_players')).then(snap => {
      if(snap.exists()){
        const players = snap.val();
        let count = 0;
        for(let pid in players){ push(ref(db, `game_players/${pid}/mail`), mailData); count++; }
        alert(`✅ 全服邮件发送成功！共发送给 ${count} 名玩家。`);
        document.getElementById('selectModal').style.display = 'none';
      }
    });
  } else {
    push(ref(db, `game_players/${targetId}/mail`), mailData).then(() => {
      alert("✅ 邮件发送成功！");
      document.getElementById('selectModal').style.display = 'none';
    });
  }
};

window.openSelectionModal = function(title, items, onSelectCallback) {
  document.getElementById('selectModalTitle').innerText = title;
  const el = document.getElementById('selectModalContent'); el.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div'); div.className = 'list-item';
    div.innerHTML = `<span>${item.label}</span><span style="color:#00c6ff;">${item.sub || ''}</span>`;
    div.onclick = () => {
      onSelectCallback(item.value);
      document.getElementById('selectModal').style.display = 'none';
    };
    el.appendChild(div);
  });
  document.getElementById('selectModal').style.display = 'flex';
};

window.createGiftPack = async function() {
  const name = prompt("请输入礼包名称（如：特惠大礼包）：", "特惠大礼包");
  if (!name) return;
  let items = [];
  let adding = true;
  while (adding) {
    const type = prompt("添加物品类型：\n1. 仙桃\n2. 仙玉\n3. 装备\n4. 经验\n5. 结束添加", "1");
    if (type === '5' || type === null) { adding = false; break; }
    let itemData = { type: '' };
    if (type === '1') { itemData.type = 'peaches'; itemData.amount = parseBigNum(prompt("数量:", "10000"), 0); }
    else if (type === '2') { itemData.type = 'jade'; itemData.amount = parseBigNum(prompt("数量:", "100"), 0); }
    else if (type === '3') { itemData.type = 'equipment'; const part = prompt("部位:", "weapon"); const q = parseInt(prompt("品质 0-106:", "10")) || 0; itemData.eq = { id: 'EQ-GIFT-' + Date.now() + Math.random(), part, quality: q, atk: 1000*(q+1), hp: 2000*(q+1), critRate: 0.05, critDmg: 0.5, enhance: 0 }; }
    else if (type === '4') { itemData.type = 'exp'; itemData.amount = parseBigNum(prompt("经验数量:", "100000"), 0); }
    else continue;
    items.push(itemData);
    alert("已添加：" + itemData.type);
  }
  if (items.length === 0) return alert("未添加任何物品");
  const priceStr = prompt("请输入价格（例如 10t 代表10仙玉，500d 代表500仙桃）：", "10t");
  if (!priceStr) return;
  let cost = 0; let currency = 'jade';
  if (priceStr.endsWith('t')) { cost = parseFloat(priceStr.slice(0, -1)); currency = 'jade'; }
  else if (priceStr.endsWith('d')) { cost = parseFloat(priceStr.slice(0, -1)); currency = 'peaches'; }
  else { alert("格式错误，需以 t 或 d 结尾"); return; }
  if (isNaN(cost)) return alert("价格错误");
  push(ref(db, 'game_gifts'), { name, items, cost, currency, createdAt: Date.now() }).then(() => alert("✅ 礼包发布成功！"));
};
