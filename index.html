<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>终极上帝控制台</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove, query, limitToLast, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const myName = "👑 开发者"; 
        let bannedUsers = [];
        let currentGroupId = ""; 
        let chatRef = null;
        let allGroups = [];

        const groupListEl = document.getElementById('groupList');
        const chatContent = document.getElementById('chatContent');
        const msgInput = document.getElementById('msgInput');
        const chatTitle = document.getElementById('chatTitle');

        window.onload = function() { 
            listenBans(); 
            listenAllGroups(); // 监听所有群
        }

        // 1. 实时监听整个数据库里有哪些群
        function listenAllGroups() {
            const groupInfoRef = ref(db, 'group_info');
            onValue(groupInfoRef, (snapshot) => {
                allGroups = [];
                groupListEl.innerHTML = ''; // 清空列表
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let gid in data) {
                        allGroups.push(gid);
                        // 在左侧生成群列表按钮
                        const btn = document.createElement('div');
                        btn.className = 'group-item';
                        btn.innerHTML = `💬 群号: ${gid}<br><span style="font-size:10px;color:#888;">群主: ${data[gid].creator}</span>`;
                        btn.onclick = () => spyGroup(gid);
                        groupListEl.appendChild(btn);
                    }
                } else {
                    groupListEl.innerHTML = '<div style="color:#555; font-size:12px; text-align:center; margin-top:20px;">当前全网没有任何群</div>';
                }
            });
        }

        // 2. 监听封禁名单
        function listenBans() {
            const banRef = ref(db, 'banned');
            onChildAdded(banRef, (snapshot) => {
                const bannedName = snapshot.val();
                if (!bannedUsers.includes(bannedName)) {
                    bannedUsers.push(bannedName);
                    document.getElementById('banList').innerText = bannedUsers.join(", ");
                }
            });
        }

        // 3. 隐身潜入某个群
        window.spyGroup = function(groupId) {
            currentGroupId = groupId;
            chatContent.innerHTML = `<div style="text-align:center; color:#ff3b30; font-size:12px; margin-top:20px;">已隐身接入群 [${groupId}]，对方无感知...</div>`;
            chatTitle.innerText = `正在监控：群 ${groupId}`;
            
            chatRef = query(ref(db, `groups/${groupId}`), limitToLast(50));
            onChildAdded(chatRef, (snapshot) => {
                const data = snapshot.val();
                if(currentGroupId === groupId) {
                    addMessageToUI(data.sender, data.text, snapshot.key);
                }
            });
        }

        // 4. 强制发系统公告
        window.sendMsg = function() {
            const text = msgInput.value.trim();
            if (!text || !currentGroupId) return alert("请先在左侧选一个群！");
            push(ref(db, `groups/${currentGroupId}`), { sender: "📢 系统管理员", text: text, time: Date.now() });
            msgInput.value = '';
        }
        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        // 5. 渲染聊天消息
        function addMessageToUI(sender, text, key) {
            const isMe = (sender === "📢 系统管理员");
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
            
            const banBtn = (!isMe) ? `<span style="color:#ff3b30; font-size:12px; margin-left:10px; cursor:pointer;" onclick="banUser('${sender}')">[封禁]</span>` : '';
            const deleteBtn = (!isMe) ? `<span style="color:#888; font-size:12px; margin-left:10px; cursor:pointer;" onclick="deleteMsg('${key}')">[删除]</span>` : '';

            div.innerHTML = `
                <div class="msg-name">${!isMe ? sender + banBtn + deleteBtn : '系统公告'}</div>
                <div class="msg-text">${text}</div>
            `;
            chatContent.appendChild(div);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 6. 删除某条消息
        window.deleteMsg = function(key) {
            if(!currentGroupId) return;
            remove(ref(db, `groups/${currentGroupId}/` + key));
        }

        // 7. 全网封杀
        window.banUser = function(name) {
            if(confirm(`确定要全网封杀【${name}】吗？`)) {
                set(ref(db, 'banned/' + name), name).then(() => { alert(`已封杀！`); });
            }
        }

        // 8. ☢️ 终极核武器：清空所有群
        window.clearAllGroups = function() {
            if(confirm("⚠️ 警告：确定要毁灭所有群聊数据吗？所有聊天记录和群号将灰飞烟灭！")) {
                remove(ref(db, 'groups'));
                remove(ref(db, 'group_info')).then(() => {
                    alert("所有群聊已清空！");
                    currentGroupId = "";
                    chatTitle.innerText = "等待选择监控目标...";
                    chatContent.innerHTML = `<div style="text-align:center; color:#666; margin-top:50px;">等待选择监控目标...</div>`;
                });
            }
        }

        // 9. ☢️ 终极核武器：清空所有账号
        window.clearAllUsers = function() {
            if(confirm("⚠️ 警告：确定要抹除所有同学的账号和密码吗？他们将无法再登录！")) {
                remove(ref(db, 'users')).then(() => {
                    alert("所有账号已抹除！");
                });
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #050505; height: 100vh; display: flex; color: #fff; overflow: hidden; }
        
        /* 左侧侧边栏 */
        .sidebar { width: 35%; max-width: 300px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px 15px; border-bottom: 1px solid #333; }
        .sidebar-header h1 { font-size: 16px; color: #ff3b30; margin-bottom: 15px; text-align: center;}
        
        .danger-zone { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;}
        .danger-btn { background: #330000; color: #ff3b30; border: 1px solid #ff3b30; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px;}
        .danger-btn:hover { background: #ff3b30; color: #fff; }

        .group-list { flex: 1; overflow-y: auto; padding: 10px; }
        .group-item { background: #222; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 3px solid #007aff; font-size: 14px;}
        .group-item:hover { background: #333; transform: translateX(3px); }

        /* 右侧主聊天区 */
        .main-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        .chat-header { padding: 20px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;}
        .chat-header h1 { font-size: 16px; color: #fff; }
        .ban-info { font-size: 12px; color: #ff9999; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; display: flex; align-items: center; }
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-all;}
        .msg.mine .msg-text { background: #ff3b30; color: #fff; }
        .msg.theirs .msg-text { background: #222; color: #fff; }

        .input-area { padding: 15px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none;}
        .input-area button { background: #ff3b30; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 左侧：全网群组与核武按钮 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>👑 上帝视角</h1>
            <div class="danger-zone">
                <button class="danger-btn" onclick="clearAllGroups()">☢️ 毁灭全网群聊</button>
                <button class="danger-btn" onclick="clearAllUsers()">☢️ 抹除所有账号</button>
            </div>
        </div>
        <div class="group-list" id="groupList">
            <div style="color:#555; font-size:12px; text-align:center; margin-top:20px;">雷达扫描中...</div>
        </div>
    </div>

    <!-- 右侧：监控聊天区 -->
    <div class="main-area">
        <div class="chat-header">
            <h1 id="chatTitle">等待选择监控目标...</h1>
            <div class="ban-info">封杀名单：<span id="banList">暂无</span></div>
        </div>
        <div class="chat-content" id="chatContent">
            <div style="text-align:center; color:#666; margin-top:50px;">请在左侧点击任意一个群聊进行隐身潜入...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="以系统管理员身份强制发公告..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发布</button>
        </div>
    </div>
</body>
</html>
